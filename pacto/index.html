<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b090d">
<title>Pacto dos Invocadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Figtree:wght@400;600;800;900&display=swap">
<style>
*{box-sizing:border-box} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0;font-size:14px} [hidden]{display:none!important}
</style>
<style>
/* Layout: portrait 9:16 frame. Resource bar pinned on top, six-tab bar pinned at the thumb; windows open as dark worn panels in between. Single dark look by choice. */
:root {
  --void: #0b090d;
  --panel: #141016;
  --panel-2: #1d1720;
  --bronze: #a8824c;
  --bronze-hi: #d8b57a;
  --ink: #eee6da;
  --beige: #e3cfa8;
  --muted: #9d9183;
  --blood: #c23a36;
  --gem: #e0344a;
  --gold: #f0c057;
  --mana: #8b54ee;
  --go: #3f9a4a;
  --heal: #5fc48a;
  --r0: #8d8d8d; --r1: #3f7fd6; --r2: #c047c8; --r3: #e2a83a;
  --display: "Cormorant SC", "Palatino Linotype", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; background: var(--void); }
@media (min-width: 560px) { #app { border-left: 1px solid #2a2230; border-right: 1px solid #2a2230; } }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
#overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.hpb { position: absolute; width: 38px; height: 5px; background: #000c; transform: translate(-50%, -50%); clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%); }
.hpb i { display: block; height: 100%; background: var(--blood); }
.hpb.ally i { background: var(--heal); }
.hpb.boss { width: 90px; height: 7px; }
.pop { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 15px; text-shadow: 0 2px 0 #000, 0 0 5px #000; animation: rise 0.8s ease-out forwards; white-space: nowrap; }
.pop.big { font-size: 20px; font-family: var(--display); }
@keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pop, .banner { animation-duration: 0.01s; } }

button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible { outline: 2px solid var(--bronze-hi); outline-offset: 2px; }
.btn { background: linear-gradient(#2a2128, #17121a); border: 1px solid var(--bronze); border-radius: 3px; padding: 10px 14px; font-weight: 800; letter-spacing: 0.02em; box-shadow: inset 0 1px 0 #ffffff14, 0 2px 0 #000; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.go { background: linear-gradient(#56b05c, #2b6e33); border-color: #9be09f; color: #f2fff2; }
.btn.red { background: linear-gradient(#d44a40, #7d1d1b); border-color: #f0a090; }
.btn.purple { background: linear-gradient(#8a5ad8, #46277e); border-color: #c9a8ff; }
.btn.sm { padding: 6px 10px; font-size: 13px; }

/* Resource bar */
.res { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 6px; padding-block: 8px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); background: linear-gradient(#0b090df0, #0b090d00); }
.cur { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 3px 0 4px; border-radius: 13px; background: #000c; border: 1px solid #3a2f2a; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.cur svg { width: 18px; height: 18px; }
.cur .plus { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(#56b05c, #2b6e33); display: grid; place-items: center; font-weight: 900; font-size: 15px; line-height: 1; }
.res .spacer { flex: 1; }
.ico { position: relative; width: 30px; height: 30px; border-radius: 4px; background: #000b; border: 1px solid #3a2f2a; display: grid; place-items: center; }
.ico svg { width: 18px; height: 18px; }
.dot { position: absolute; top: -3px; right: -3px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--blood); font-size: 9px; font-weight: 900; display: grid; place-items: center; }

/* Tab bar */
.tabs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: end; gap: 2px; padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); padding-block: 10px 8px; background: linear-gradient(#0b090d00, #0b090df5 35%); }
.tab { display: grid; justify-items: center; gap: 3px; color: var(--muted); font-size: 10.5px; font-weight: 800; letter-spacing: 0.03em; }
.tab .disc { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(#2a2128, #110d13); border: 2px solid #4a3c30; box-shadow: 0 2px 6px #000; transition: transform 0.15s; }
.tab .disc svg { width: 24px; height: 24px; }
.tab.on { color: var(--beige); }
.tab.on .disc { transform: scale(1.18) translateY(-4px); border-color: var(--bronze-hi); box-shadow: 0 0 14px #d8b57a55, 0 2px 6px #000; }
.tab .soon { font-size: 8.5px; color: #6f665c; font-weight: 600; }

/* Lobby */
.lobby-left { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 52px; z-index: 3; display: grid; gap: 8px; }
.sq { width: 46px; height: 46px; border-radius: 6px; background: linear-gradient(#2a2128, #110d13); border: 1px solid #5a4632; display: grid; place-items: center; position: relative; box-shadow: 0 2px 6px #000; }
.sq svg { width: 26px; height: 26px; }
.sq span.lbl { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 800; white-space: nowrap; text-shadow: 0 1px 2px #000; }
.lobby-title { position: absolute; top: 50px; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 3; text-align: right; font-family: var(--display); font-size: 26px; line-height: 0.95; color: var(--beige); text-shadow: 0 0 18px #8b54ee55, 0 2px 0 #000; }
.pcard { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 96px; z-index: 3; width: min(220px, 56%); background: linear-gradient(90deg, #0b090ddd, #0b090d55); border-left: 3px solid var(--bronze); padding: 8px 10px; }
.pcard .t { font-size: 11px; color: var(--bronze-hi); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
.pcard .n { font-family: var(--display); font-size: 24px; line-height: 1.05; color: var(--beige); }
.xp { height: 5px; background: #000; margin-top: 5px; }
.xp i { display: block; height: 100%; background: linear-gradient(90deg, #8a6a2a, var(--gold)); }
.pcard .btns { display: flex; gap: 6px; margin-top: 8px; }
.play { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 100px; z-index: 3; width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(#d44a40, #5a1212 70%); border: 3px solid #f0a090; box-shadow: 0 0 22px #c23a3688, 0 3px 0 #000; display: grid; place-items: center; text-align: center; font-family: var(--display); font-size: 21px; line-height: 0.95; color: #fff3e6; text-shadow: 0 2px 0 #000; }
.play small { display: block; font-family: var(--body); font-size: 10px; font-weight: 800; margin-top: 3px; }

/* Windows */
.win { position: absolute; z-index: 4; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); top: 46px; bottom: 82px; display: flex; flex-direction: column; background: linear-gradient(#17121a, #0e0b10); border: 1px solid var(--bronze); box-shadow: 0 0 0 1px #000, inset 0 0 40px #000, 0 10px 40px #000c; }
.win.full { bottom: 8px; }
.win-h { position: relative; padding: 10px 44px; text-align: center; border-bottom: 1px solid #3a2f2a; background: linear-gradient(#221a20, #120e14); }
.win-h h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 23px; color: var(--beige); letter-spacing: 0.04em; text-wrap: balance; }
.win-h .x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 1px solid #5a4632; border-radius: 3px; background: #0b090d; font-size: 18px; font-weight: 900; color: var(--beige); }
.win-h .bk { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); }
.win-b { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
.win-f { padding: 10px 12px; border-top: 1px solid #3a2f2a; display: flex; gap: 8px; }
.win-f .btn { flex: 1; }
.sub { color: var(--muted); margin: 0 0 10px; line-height: 1.45; font-size: 13.5px; }
.h3 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bronze-hi); margin: 12px 0 8px; display: flex; justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 3px; background: #000a; border: 1px solid #3a3040; font-weight: 600; font-size: 12px; }
.foes { display: flex; flex-wrap: wrap; gap: 6px; }

/* Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 7px; }
.grid.six { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.cv { position: relative; aspect-ratio: 3 / 4; border: 2px solid var(--r0); border-radius: 4px; background: #110d13; overflow: hidden; text-align: left; }
.cv.r1 { border-color: var(--r1); } .cv.r2 { border-color: var(--r2); } .cv.r3 { border-color: var(--r3); }
.cv canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hex { position: absolute; z-index: 2; top: 2px; left: 2px; width: 21px; height: 23px; display: grid; place-items: center; font-weight: 900; font-size: 11.5px; background: linear-gradient(#a77cf5, #4a2690); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); text-shadow: 0 1px 1px #000; }
.lvband { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 2px 3px; background: linear-gradient(#0000, #000d 40%); font-size: 9.5px; font-weight: 800; text-align: center; line-height: 1.1; }
.lvband b { display: block; font-size: 9px; color: var(--beige); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uparrow { position: absolute; z-index: 2; top: 3px; right: 3px; width: 14px; height: 14px; background: var(--go); clip-path: polygon(50% 0, 100% 60%, 70% 60%, 70% 100%, 30% 100%, 30% 60%, 0 60%); }
.cv.sel { box-shadow: 0 0 0 2px #fff, 0 0 12px #fff8; }
.cv.empty { border-style: dashed; border-color: #3a3040; }
.cv.ghost { opacity: 0.35; }
.detail { margin-top: 10px; background: #0b090d; border: 1px solid #3a2f2a; padding: 10px; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; }
.detail .st { display: grid; grid-template-columns: auto auto; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.detail .st b { color: var(--ink); font-variant-numeric: tabular-nums; }
.copies { height: 12px; background: #000; border: 1px solid #333; position: relative; margin: 6px 0; }
.copies i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2b6e33, #56b05c); }
.copies span { position: relative; display: block; font-size: 9.5px; line-height: 11px; text-align: center; font-weight: 800; }
.detail .acts { grid-column: 1 / -1; display: flex; gap: 8px; }
.detail .acts .btn { flex: 1; }

/* Village */
.sign { text-align: center; margin: 0 auto 10px; padding: 8px 16px; width: fit-content; background: linear-gradient(#6a4a2c, #3e2a18); border: 2px solid #2a1a0e; border-radius: 4px; font-family: var(--display); font-size: 22px; color: #f1dcb4; text-shadow: 0 2px 0 #1a0e06; box-shadow: 0 3px 0 #000; }
.shops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.shop { position: relative; aspect-ratio: 4 / 5; border: 1px solid var(--bronze); overflow: hidden; text-align: left; background: #110d13; }
.shop canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.shop .lab { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 8px; background: linear-gradient(#0000, #000e); }
.shop .lab b { display: block; font-family: var(--display); font-size: 19px; color: var(--beige); }
.shop .lab span { font-size: 11px; color: var(--muted); }
.npc { display: grid; gap: 10px; }
.npc .portrait { position: relative; height: 210px; border: 1px solid #3a2f2a; overflow: hidden; }
.npc .portrait canvas { width: 100%; height: 100%; display: block; }
.npc .nm { font-family: var(--display); font-size: 22px; color: var(--gold); }
.hearts { color: var(--gem); letter-spacing: 2px; font-size: 14px; }
.hearts .off { color: #3a2f2a; }
.speech { background: #0b090d; border: 1px solid #3a2f2a; padding: 10px 12px; line-height: 1.45; font-size: 14px; position: relative; }
.opts { display: grid; gap: 6px; }
.opts .btn { text-align: left; display: flex; gap: 10px; align-items: center; }
.offer { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px; background: #0b090d; border: 1px solid #2a2228; margin-bottom: 6px; }
.offer .cv { aspect-ratio: 3 / 4; }
.offer .t b { display: block; font-size: 13px; }
.offer .t span { font-size: 11.5px; color: var(--muted); }
.timer { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* World map */
.parch { position: relative; aspect-ratio: 3 / 4; max-height: 100%; margin: 0 auto; border: 1px solid #5a4632; background: radial-gradient(ellipse at 50% 45%, #cdb68c, #9c8358 60%, #2a1f14 100%); overflow: hidden; }
.parch canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.region { position: absolute; transform: translate(-50%, -50%); text-align: center; color: #1c120a; font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1; text-shadow: 0 0 6px #e6d2a8; }
.region small { display: block; font-family: var(--body); font-size: 10px; font-weight: 800; margin-top: 2px; }
.region.locked { opacity: 0.55; }
.region.open::before { content: ""; display: block; width: 22px; height: 22px; margin: 0 auto 3px; border-radius: 50%; background: radial-gradient(#ff6a5a, #7a1010); box-shadow: 0 0 12px #ff3b2b; }
.diff { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 8px; font-family: var(--display); font-size: 18px; color: var(--beige); }
.zone { position: relative; aspect-ratio: 3 / 4.4; margin: 0 auto; border: 1px solid #3a2f2a; background: radial-gradient(ellipse at 50% 20%, #3a1e22, #120c10 70%); overflow: hidden; }
.zone canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.znode { position: absolute; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(#3a2e28, #120e10); border: 2px solid #5a4632; display: grid; place-items: center; font-weight: 900; font-size: 15px; box-shadow: 0 2px 6px #000; }
.znode.done { border-color: var(--bronze-hi); color: var(--beige); }
.znode.next { border-color: #fff; box-shadow: 0 0 14px #fff8; }
.znode.boss { width: 58px; height: 58px; background: radial-gradient(#c23a36, #3a0a0a); border-color: #ff8a7a; box-shadow: 0 0 20px #ff3b2b; }
.znode:disabled { opacity: 0.45; cursor: default; }
.znode .stars { position: absolute; bottom: -12px; font-size: 9px; color: var(--gold); letter-spacing: 1px; }

/* Hero */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stat { background: #0b090d; border: 1px solid #2a2228; padding: 8px; }
.stat span { font-size: 11px; color: var(--muted); display: block; }
.stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.slot { aspect-ratio: 1; border: 1px dashed #4a3c30; display: grid; place-items: center; font-size: 10px; color: var(--muted); text-align: center; background: #0b090d; }
.soonbox { text-align: center; padding: 24px 12px; }
.soonbox svg { width: 64px; height: 64px; opacity: 0.8; }
.soonbox h3 { font-family: var(--display); font-size: 24px; margin: 10px 0 6px; color: var(--beige); }

/* Battle HUD */
.hud { position: absolute; inset: 0; z-index: 4; pointer-events: none; padding-block: 8px 10px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; }
.hud > * { pointer-events: auto; }
.hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.waves { background: #000b; border: 1px solid #3a2f2a; padding: 5px 8px; min-width: 0; }
.waves .l { font-size: 9.5px; letter-spacing: 0.12em; color: var(--bronze-hi); font-weight: 800; text-transform: uppercase; }
.waves .pips { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
.waves .pip { width: 12px; height: 12px; transform: rotate(45deg) scale(0.75); background: #2a2228; border: 1px solid #5a4632; }
.waves .pip.on { background: var(--blood); border-color: #ff8a7a; }
.waves .pip.boss { background: #3a0a0a; border-color: #ff3b2b; }
.herohp { margin-top: 6px; position: relative; width: 150px; height: 14px; background: #000c; border: 1px solid #4a3a2c; }
.herohp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #7d1f22, var(--blood)); }
.herohp span { position: relative; display: block; text-align: center; font-size: 10px; line-height: 13px; font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
.tright { display: grid; justify-items: end; gap: 6px; }
.time { background: linear-gradient(#5a1414, #2a0808); border: 1px solid #a04040; padding: 4px 10px; text-align: right; }
.time .l { font-size: 9px; letter-spacing: 0.1em; color: #f0b0a0; font-weight: 800; text-transform: uppercase; }
.time b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.time.low b { color: #ffd04a; }
.menu-btn { width: 38px; height: 38px; border-radius: 4px; background: #000b; border: 1px solid #5a4632; display: grid; place-items: center; }
.menu-btn svg { width: 20px; height: 20px; }
.stage-name { text-align: center; font-family: var(--display); font-size: 16px; color: var(--beige); text-shadow: 0 1px 3px #000; margin-top: 4px; }
.hud-bottom { margin-top: auto; display: grid; gap: 6px; }
.manabar { position: relative; height: 22px; display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; }
.manabar .crystal { width: 26px; height: 26px; z-index: 2; filter: drop-shadow(0 0 6px #8b54ee); }
.manabar .bar { position: relative; height: 16px; margin-left: -6px; background: #000c; border: 1px solid #4a3270; }
.manabar .bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #4a2690, var(--mana), #c6a8ff); }
.manabar .bar span { position: relative; display: block; font-size: 11px; line-height: 15px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
.deck { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.dc { position: relative; aspect-ratio: 3 / 4; border: 2px solid var(--r0); border-radius: 4px; background: #110d13; overflow: hidden; touch-action: manipulation; }
.dc.r1 { border-color: var(--r1); } .dc.r2 { border-color: var(--r2); } .dc.r3 { border-color: var(--r3); }
.dc canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.dc .cd { position: absolute; inset: 0; background: #000c; transform-origin: bottom; z-index: 1; }
.dc.poor canvas { filter: grayscale(0.9) brightness(0.55); }
.dc.ready { box-shadow: 0 0 10px #b48cff99; }
.dc:active { transform: scale(0.95); }

.result { position: absolute; z-index: 6; left: 16px; right: 16px; top: 22%; text-align: center; background: linear-gradient(#17121a, #0e0b10); border: 1px solid var(--bronze); padding: 22px 16px; box-shadow: 0 10px 40px #000; }
.result h2 { font-family: var(--display); font-size: 44px; margin: 0; color: var(--beige); letter-spacing: 0.04em; }
.result.lose h2 { color: var(--blood); }
.result p { color: var(--muted); line-height: 1.5; }
.result .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.toast { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); background: #0b090dee; border: 1px solid var(--bronze); padding: 9px 14px; border-radius: 3px; z-index: 9; font-size: 14px; text-align: center; max-width: 80%; pointer-events: none; }
.banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--display); font-size: 34px; color: #e7d3b0; text-shadow: 0 0 18px #c23a36, 0 2px 0 #000; pointer-events: none; animation: banner 1.8s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.3); } 15% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.45; }
@media (max-width: 380px) { .tab .disc { width: 40px; height: 40px; } .tab { font-size: 9.5px; } }
</style>
</head>
<body>

<div id="app">
  <div id="stage"></div>
  <div id="overlay"></div>
  <div id="ui"></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== SIM START =====
// Engine-free rules: data, progression and the run simulation. Mirrors the Unity Logic assembly.
const RARITY = ["Comum", "Rara", "Épica", "Lendária"];
const UNIT_TYPES = {
  // allies
  ghoul:    { name: "Carniçal", hp: 120, atk: 14, range: 1.1, interval: 0.8, speed: 3.6, radius: 0.4, role: "melee", color: "#7d8a6a", eye: "#b48cff" },
  bonearch: { name: "Arqueiro Ossudo", hp: 80, atk: 13, range: 5.5, interval: 1.0, speed: 3.2, radius: 0.4, role: "ranged", color: "#cfc6b2", eye: "#b48cff" },
  bat:      { name: "Morcego", hp: 45, atk: 8, range: 1.0, interval: 0.5, speed: 5.5, radius: 0.3, role: "melee", flying: true, color: "#3b2f45", eye: "#ff9ad5" },
  golem:    { name: "Golem de Lápide", hp: 650, atk: 20, range: 1.3, interval: 1.4, speed: 2.4, radius: 0.7, role: "tank", color: "#6b6670", eye: "#9fd3ff" },
  witch:    { name: "Bruxa do Pântano", hp: 110, atk: 22, range: 4.5, interval: 1.2, speed: 3.0, radius: 0.4, role: "healer", color: "#4f6b4a", eye: "#9cff9c" },
  knight:   { name: "Cavaleiro Sem Cabeça", hp: 420, atk: 42, range: 1.4, interval: 0.9, speed: 3.4, radius: 0.55, role: "melee", color: "#3a3440", eye: "#ff7a3d" },
  abom:     { name: "Abominação", hp: 900, atk: 55, range: 1.6, interval: 1.6, speed: 2.6, radius: 0.85, role: "area", color: "#8a5a5a", eye: "#ffd04a" },
  merc:     { name: "Prisioneiro", hp: 160, atk: 16, range: 1.1, interval: 0.9, speed: 3.5, radius: 0.45, role: "melee", color: "#8a6a4a", eye: "#e7d3b0" },
  // enemies
  crawler:  { name: "Rastejante", hp: 70, atk: 9, range: 1.0, interval: 0.9, speed: 3.4, radius: 0.4, role: "melee", color: "#5a4a3a", eye: "#ff3b3b" },
  spearman: { name: "Esqueleto Lanceiro", hp: 110, atk: 13, range: 1.5, interval: 1.1, speed: 2.8, radius: 0.45, role: "melee", color: "#bfb59f", eye: "#ff3b3b" },
  ogre:     { name: "Ogro do Pântano", hp: 480, atk: 26, range: 1.4, interval: 1.6, speed: 1.9, radius: 0.8, role: "tank", color: "#5d6b45", eye: "#ff3b3b" },
  hexer:    { name: "Atirador Corrompido", hp: 70, atk: 12, range: 5.5, interval: 1.3, speed: 2.6, radius: 0.4, role: "ranged", color: "#4a3a5a", eye: "#ff3b3b" },
  shaman:   { name: "Xamã Ossudo", hp: 90, atk: 18, range: 4.5, interval: 1.6, speed: 2.4, radius: 0.4, role: "healer", color: "#6a5040", eye: "#ff3b3b" },
  boss:     { name: "Senhor do Sino Partido", hp: 2600, atk: 34, range: 2.0, interval: 1.5, speed: 1.7, radius: 1.2, role: "area", color: "#2e2636", eye: "#ff2020", boss: true },
};
const CARDS = [
  { id: "ghoul", name: "Carniçal", kind: "summon", unit: "ghoul", count: 2, cost: 3, cd: 4, rarity: 0, text: "2 lutadores rápidos" },
  { id: "bonearch", name: "Arqueiro Ossudo", kind: "summon", unit: "bonearch", count: 2, cost: 4, cd: 5, rarity: 0, text: "2 atiradores à distância" },
  { id: "bat", name: "Enxame de Morcegos", kind: "summon", unit: "bat", count: 3, cost: 2, cd: 3, rarity: 0, text: "3 voadores frágeis" },
  { id: "frost", name: "Névoa Gélida", kind: "spell", spell: "slow", cost: 3, cd: 8, rarity: 0, text: "Abranda inimigos à volta" },
  { id: "golem", name: "Golem de Lápide", kind: "summon", unit: "golem", count: 1, cost: 7, cd: 10, rarity: 1, text: "Tanque, aguenta tudo" },
  { id: "witch", name: "Bruxa do Pântano", kind: "summon", unit: "witch", count: 1, cost: 5, cd: 8, rarity: 1, text: "Cura os aliados" },
  { id: "balm", name: "Bálsamo Sombrio", kind: "spell", spell: "heal", cost: 4, cd: 10, rarity: 1, text: "Cura 35% a todos" },
  { id: "embers", name: "Chuva de Brasas", kind: "spell", spell: "fire", cost: 5, cd: 7, rarity: 1, text: "Dano em área no alvo" },
  { id: "candle", name: "Vela de Almas", kind: "spell", spell: "mana", cost: 1, cd: 12, rarity: 2, text: "Devolve 4 de mana" },
  { id: "knight", name: "Cavaleiro Sem Cabeça", kind: "summon", unit: "knight", count: 1, cost: 9, cd: 12, rarity: 2, text: "Dano corpo a corpo alto" },
  { id: "abom", name: "Abominação", kind: "summon", unit: "abom", count: 1, cost: 13, cd: 18, rarity: 3, text: "Gigante com dano em área" },
];
const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));
const STARTER_CARDS = ["ghoul", "bonearch", "bat", "frost", "golem", "balm"];
const DRAW_RATES = [0.62, 0.27, 0.09, 0.02], DRAW_COST = 120, DRAW10_COST = 1080, LEGEND_PITY = 60;

const Prog = {
  cardScale: lv => 1 + 0.12 * (lv - 1),
  heroScale: lv => 1 + 0.1 * (lv - 1),
  maxCardLevel: 10,
  copiesToLevel: lv => lv * 2,
  goldToLevel: lv => lv * lv * 60,
  heroXpToNext: lv => 80 + lv * 40,
};

function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// World 1: ten stages, a mini-boss ogre at 5 and the bell lord at 10.
function stageDef(n) {
  const pools = [["crawler"], ["crawler", "spearman"], ["crawler", "spearman", "hexer"], ["crawler", "spearman", "hexer", "shaman"]];
  const pool = pools[Math.min(pools.length - 1, Math.floor((n - 1) / 2))];
  return {
    n, boss: n === 10, mini: n === 5,
    name: n === 10 ? "O Sino Partido" : ["Portão da Cripta", "Ossário", "Corredor dos Jarros", "Celas Esquecidas", "Covil do Ogro", "Capela Afundada", "Escadaria Sombria", "Ponte dos Ossos", "Sala dos Ecos"][n - 1],
    length: 60 + n * 6,
    groups: 3 + Math.ceil(n * 0.7),
    level: n,
    pool,
    gold: 80 + n * 25, xp: 40 + n * 12, crystals: 80, timeLimit: 150 + n * 15,
  };
}

class Run {
  constructor(stage, deck, profile, seed) {
    this.stage = stage;
    this.r = rng(seed || stage.n * 7919);
    this.t = 0;
    this.state = "run";
    this.events = [];
    this.units = [];
    this.objects = [];
    this.nextId = 1;
    this.mana = 6; this.maxMana = 25; this.regen = 0.55;
    this.timeLimit = stage.timeLimit; this.ambushes = 0;
    this.loot = { gold: 0, copies: {} };
    this.cards = deck.map(id => ({ def: CARD[id], level: (profile.cards[id] || { level: 1 }).level, cd: 0 }));
    const hs = Prog.heroScale(profile.heroLevel);
    this.hero = this.add({ type: "hero", team: "P", x: 0, z: 0, hp: Math.round(320 * hs), atk: Math.round(18 * hs), range: 6.5, interval: 0.55, speed: 4.6, radius: 0.45, role: "ranged", hero: true });
    this.moveTo = null; this.focus = null;
    this.build();
  }
  add(o) {
    const u = Object.assign({ id: this.nextId++, cdT: 0, slow: 0, maxHp: o.hp, awake: true, lunge: 0, vx: 0, vz: 0 }, o);
    this.units.push(u);
    this.events.push({ k: "spawn", u });
    return u;
  }
  spawnUnit(typeId, team, x, z, level, extra) {
    const T = UNIT_TYPES[typeId], s = team === "P" ? Prog.cardScale(level) : (T.boss ? 1 : 1.25) * (1 + 0.16 * (level - 1));
    return this.add(Object.assign({ type: typeId, team, x, z, hp: Math.round(T.hp * s), atk: Math.round(T.atk * s), range: T.range, interval: T.interval, speed: T.speed, radius: T.radius, role: T.role, flying: !!T.flying, boss: !!T.boss }, extra));
  }
  build() {
    const S = this.stage, r = this.r, L = S.length;
    this.endZ = -L;
    for (let g = 0; g < S.groups; g++) {
      const z = -14 - g * ((L - 22) / Math.max(1, S.groups - 1)) * (S.boss ? 0.85 : 1);
      const count = 3 + Math.floor(r() * (2 + S.n / 3));
      const gx = (r() - 0.5) * 6;
      const group = g;
      for (let i = 0; i < count; i++) {
        const type = S.pool[Math.floor(r() * S.pool.length)];
        this.spawnUnit(type, "E", gx + (r() - 0.5) * 3, z + (r() - 0.5) * 3, S.level, { awake: false, group });
      }
      if (S.mini && g === S.groups - 1) this.spawnUnit("ogre", "E", gx, z - 2, S.level + 2, { awake: false, group, hp: 900 + 120 * S.level });
    }
    if (S.boss) this.bossUnit = this.spawnUnit("boss", "E", 0, -L + 7, 1, { awake: false, group: 99, summonT: 6 });
    for (let z = -6; z > -L + 4; z -= 5 + r() * 5) this.objects.push({ id: this.nextId++, kind: r() < 0.82 ? "jar" : "chest", x: (r() - 0.5) * 10, z, done: false });
    if (S.n >= 3) this.objects.push({ id: this.nextId++, kind: "cage", x: (r() - 0.5) * 8, z: -L * 0.45, done: false });
    this.objects.forEach(o => this.events.push({ k: "obj", o }));
  }
  get groupCount() { return this.stage.groups + (this.stage.boss ? 1 : 0); }
  get allies() { return this.units.filter(u => u.team === "P" && u.hp > 0); }
  get foes() { return this.units.filter(u => u.team === "E" && u.hp > 0); }
  dist(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }
  nearest(from, list, maxD) { let best = null, bd = maxD; for (const u of list) { const d = this.dist(from, u); if (d < bd) { bd = d; best = u; } } return best; }

  playCard(i) {
    const c = this.cards[i];
    if (!c || this.state !== "run" || c.cd > 0 || this.mana < c.def.cost) return false;
    const h = this.hero, d = c.def;
    if (d.kind === "spell" && d.spell === "fire" && !this.spellTarget()) return false;
    this.mana -= d.cost; c.cd = d.cd;
    if (d.kind === "summon") {
      for (let k = 0; k < d.count; k++) {
        const a = (k - (d.count - 1) / 2) * 0.9;
        this.spawnUnit(d.unit, "P", h.x + a, h.z - 1.4, c.level, { summoned: true });
      }
      this.events.push({ k: "summon", x: h.x, z: h.z - 1.4 });
    } else this.castSpell(d.spell, c.level);
    return true;
  }
  spellTarget() {
    const f = this.focus && this.units.find(u => u.id === this.focus && u.hp > 0);
    return f || this.nearest(this.hero, this.foes.filter(u => u.awake), 12);
  }
  castSpell(spell, lv) {
    const h = this.hero, s = Prog.cardScale(lv);
    if (spell === "fire") {
      const t = this.spellTarget();
      for (const e of this.foes) if (this.dist(e, t) < 2.6) this.damage(null, e, Math.round(70 * s), true);
      this.events.push({ k: "fx", fx: "fire", x: t.x, z: t.z });
    } else if (spell === "slow") {
      for (const e of this.foes) if (this.dist(e, h) < 6) e.slow = 4 + lv * 0.2;
      this.events.push({ k: "fx", fx: "frost", x: h.x, z: h.z });
    } else if (spell === "heal") {
      for (const a of this.allies) this.heal(a, Math.round(a.maxHp * (0.35 + 0.02 * (lv - 1))));
      this.events.push({ k: "fx", fx: "heal", x: h.x, z: h.z });
    } else if (spell === "mana") {
      this.mana = Math.min(this.maxMana, this.mana + 4 + Math.floor(lv / 3));
      this.events.push({ k: "fx", fx: "mana", x: h.x, z: h.z });
    }
  }
  damage(src, tgt, n, spell) {
    if (tgt.hp <= 0) return;
    tgt.hp = Math.max(0, tgt.hp - n);
    this.events.push({ k: "hit", u: tgt, n, spell: !!spell });
    if (tgt.hp === 0) {
      this.events.push({ k: "die", u: tgt });
      if (tgt.team === "E") { this.mana = Math.min(this.maxMana, this.mana + (tgt.boss ? 10 : 1)); this.loot.gold += tgt.boss ? 200 : 3; }
      if (this.focus === tgt.id) this.focus = null;
    }
  }
  heal(u, n) { const h = Math.min(u.maxHp - u.hp, n); if (h > 0) { u.hp += h; this.events.push({ k: "heal", u, n: h }); } }

  step(dt) {
    if (this.state !== "run") return;
    this.t += dt;
    this.mana = Math.min(this.maxMana, this.mana + this.regen * dt);
    for (const c of this.cards) c.cd = Math.max(0, c.cd - dt);
    const h = this.hero;

    // Hero movement toward the finger.
    if (this.moveTo) {
      const dx = this.moveTo.x - h.x, dz = this.moveTo.z - h.z, d = Math.hypot(dx, dz);
      if (d < 0.15) this.moveTo = null;
      else { const s = Math.min(d, h.speed * dt); h.vx = dx / d; h.vz = dz / d; h.x += h.vx * s; h.z += h.vz * s; }
    }
    // Wake ambush groups as the hero approaches.
    for (const e of this.units) if (e.team === "E" && !e.awake && e.hp > 0 && this.dist(e, h) < (e.boss ? 13 : 10)) {
      this.units.filter(o => o.group === e.group && o.team === "E").forEach(o => o.awake = true);
      this.ambushes++;
      this.events.push({ k: "ambush", boss: e.boss });
    }
    // Objects the hero walks into.
    for (const o of this.objects) if (!o.done && this.dist(o, h) < 1.2) this.touch(o);

    const allies = this.allies, foes = this.foes;
    let slot = 0;
    for (const u of this.units) {
      if (u.hp <= 0) continue;
      u.cdT = Math.max(0, u.cdT - dt);
      u.slow = Math.max(0, u.slow - dt);
      u.lunge = Math.max(0, u.lunge - dt * 4);
      if (u.hero) { this.heroAttack(u, foes); continue; }
      if (u.team === "E" && !u.awake) continue;
      if (u.boss) this.bossAct(u, dt);

      const enemies = u.team === "P" ? foes : allies;
      let target = null;
      if (u.role === "healer") {
        const friends = u.team === "P" ? allies : foes;
        const hurt = friends.filter(f => f.hp < f.maxHp * 0.9 && this.dist(u, f) < u.range + 2).sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0];
        if (hurt) { if (this.dist(u, hurt) <= u.range) { if (u.cdT === 0) { u.cdT = u.interval; this.heal(hurt, u.atk); this.events.push({ k: "beam", from: u, to: hurt, heal: true }); } continue; } target = hurt; }
      }
      if (!target) {
        if (u.team === "P") {
          const f = this.focus && foes.find(e => e.id === this.focus);
          target = (f && this.dist(u, f) < 11) ? f : this.nearest(u, foes.filter(e => e.awake && (this.dist(e, h) < 8 || this.dist(e, u) < 6)), 99);
        } else {
          // Shooters go for the heroine when she is in reach; the rest hit whatever is closest.
          target = (u.role === "ranged" && this.dist(u, h) < u.range + 3) ? h : this.nearest(u, enemies, u.boss ? 30 : 16);
        }
      }
      if (u.role === "healer" && target && target.team === u.team) { this.moveToward(u, target, dt, u.range * 0.8); continue; }
      if (target) {
        const d = this.dist(u, target);
        if (d <= u.range + target.radius) {
          if (u.cdT === 0) {
            u.cdT = u.interval;
            u.vx = (target.x - u.x) / (d || 1); u.vz = (target.z - u.z) / (d || 1);
            if (u.role === "ranged" || u.role === "healer") { this.events.push({ k: "beam", from: u, to: target }); this.damage(u, target, u.atk); }
            else if (u.role === "area") { u.lunge = 1; for (const e of enemies) if (this.dist(e, target) < 1.8) this.damage(u, e, u.atk); this.events.push({ k: "fx", fx: "slam", x: target.x, z: target.z }); }
            else { u.lunge = 1; this.damage(u, target, u.atk); }
          }
        } else this.moveToward(u, target, dt, u.range * 0.9);
      } else if (u.team === "P") {
        // Formation around the heroine: fighters ahead, shooters and healers behind.
        const front = u.role !== "ranged" && u.role !== "healer";
        const k = slot++, col = (k % 4) - 1.5, row = Math.floor(k / 4);
        const goal = { x: h.x + col * 1.1, z: h.z + (front ? -1.6 - row : 1.6 + row) };
        if (this.dist(u, goal) > 0.6) this.moveToward(u, goal, dt, 0.3);
      }
    }
    this.separate();
    for (const u of this.units) { u.x = Math.max(-7, Math.min(7, u.x)); u.z = Math.max(this.endZ - 1.5, Math.min(3, u.z)); }

    if (h.hp <= 0 || this.t >= this.timeLimit) { this.state = "lose"; this.timedOut = h.hp > 0; return; }
    const bossAlive = this.bossUnit && this.bossUnit.hp > 0;
    if (h.z <= this.endZ + 1.5 && !bossAlive) this.state = "win";
    if (this.stage.boss && !bossAlive && this.bossUnit) this.state = "win";
  }
  heroAttack(h, foes) {
    if (h.cdT > 0) return;
    const f = this.focus && foes.find(e => e.id === this.focus);
    const t = (f && this.dist(h, f) <= h.range + f.radius) ? f : this.nearest(h, foes.filter(e => e.awake), h.range);
    if (!t) return;
    h.cdT = h.interval;
    this.events.push({ k: "beam", from: h, to: t, arrow: true });
    this.damage(h, t, h.atk);
  }
  bossAct(b, dt) {
    b.summonT -= dt;
    if (b.summonT <= 0) {
      b.summonT = 9;
      for (let k = 0; k < 3; k++) this.spawnUnit(k === 2 ? "hexer" : "crawler", "E", b.x + (k - 1) * 1.6, b.z + 1.5, this.stage.level, { awake: true });
      this.events.push({ k: "bell", x: b.x, z: b.z });
    }
  }
  moveToward(u, t, dt, stop) {
    const dx = t.x - u.x, dz = t.z - u.z, d = Math.hypot(dx, dz);
    if (d <= stop) return;
    const s = Math.min(d - stop, u.speed * (u.slow > 0 ? 0.45 : 1) * dt);
    u.vx = dx / d; u.vz = dz / d; u.x += u.vx * s; u.z += u.vz * s;
  }
  separate() {
    const L = this.units.filter(u => u.hp > 0 && (u.awake || u.team === "P"));
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
      const a = L[i], b = L[j];
      if (a.flying !== b.flying) continue;
      const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz), m = a.radius + b.radius;
      if (d > 0 && d < m) { const p = (m - d) / 2, nx = dx / d, nz = dz / d; if (!a.hero) { a.x -= nx * p; a.z -= nz * p; } if (!b.hero) { b.x += nx * p; b.z += nz * p; } }
    }
  }
  touch(o) {
    o.done = true;
    if (o.kind === "jar") {
      if (this.r() < 0.5) { this.mana = Math.min(this.maxMana, this.mana + 4); this.events.push({ k: "loot", o, text: "+4 mana", color: "#c6a8ff" }); }
      else { this.heal(this.hero, Math.round(this.hero.maxHp * 0.12)); this.events.push({ k: "loot", o, text: "vida", color: "#7dffa8" }); }
    } else if (o.kind === "chest") {
      const g = 25 + this.stage.n * 6; this.loot.gold += g;
      const card = CARDS[Math.floor(this.r() * CARDS.length)];
      if (this.r() < 0.45) { this.loot.copies[card.id] = (this.loot.copies[card.id] || 0) + 1; this.events.push({ k: "loot", o, text: `+1 ${card.name}`, color: "#e7d3b0" }); }
      else this.events.push({ k: "loot", o, text: `+${g} ouro`, color: "#f2c35b" });
    } else if (o.kind === "cage") {
      this.spawnUnit("merc", "P", o.x, o.z, this.stage.level, { summoned: true });
      this.events.push({ k: "loot", o, text: "Prisioneiro libertado!", color: "#e7d3b0" });
    }
  }
}

// Card draw with visible rates and a legendary guarantee.
function drawCards(profile, count, free) {
  const out = [];
  for (let i = 0; i < count; i++) {
    let r;
    if (!free && profile.pity + 1 >= LEGEND_PITY) r = 3;

const artCache = new Map();
function cardArt(id, w = 120, h = 160) {
  const key = id + w; if (artCache.has(key)) return artCache.get(key);
  const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d");
  const card = CARD[id], T = card.unit ? UNIT_TYPES[card.unit] : null;
  const base = T ? T.color : { slow: "#3a6a8a", heal: "#3a7a5a", fire: "#8a3a1a", mana: "#5a3a9a" }[card.spell];
  const grd = g.createRadialGradient(w / 2, h * 0.42, 4, w / 2, h / 2, w * 0.85); grd.addColorStop(0, base); grd.addColorStop(1, "#08060a");
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  const r = rng(id.length * 977 + id.charCodeAt(0));
  g.fillStyle = "rgba(255,255,255,0.04)"; for (let i = 0; i < 40; i++) g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2);
  g.fillStyle = "rgba(0,0,0,0.62)";
  if (T) {
    g.beginPath();
    if (T.role === "tank" || card.unit === "abom") { g.ellipse(w / 2, h * 0.66, w * 0.34, h * 0.34, 0, 0, Math.PI * 2); g.ellipse(w / 2, h * 0.34, w * 0.16, h * 0.12, 0, 0, Math.PI * 2); }
    else if (T.flying) { g.moveTo(w * 0.05, h * 0.38); g.quadraticCurveTo(w / 2, h * 0.08, w * 0.95, h * 0.38); g.quadraticCurveTo(w / 2, h * 0.62, w * 0.05, h * 0.38); }
    else { g.ellipse(w / 2, h * 0.3, w * 0.13, h * 0.1, 0, 0, Math.PI * 2); g.moveTo(w / 2, h * 0.36); g.lineTo(w * 0.8, h); g.lineTo(w * 0.2, h); g.closePath(); }
    g.fill();
    g.fillStyle = T.eye; g.shadowColor = T.eye; g.shadowBlur = 10;
    const ey = T.role === "tank" || card.unit === "abom" ? h * 0.34 : T.flying ? h * 0.36 : h * 0.3;
    g.beginPath(); g.arc(w / 2 - 7, ey, 2.6, 0, 7); g.arc(w / 2 + 7, ey, 2.6, 0, 7); g.fill();
    g.shadowBlur = 0;
    if (card.count > 1) { g.fillStyle = "#e3cfa8"; g.font = "900 15px Figtree, sans-serif"; g.textAlign = "right"; g.fillText("x" + card.count, w - 6, 20); }
  } else {
    g.strokeStyle = { slow: "#bfe6ff", heal: "#9cff9c", fire: "#ffb060", mana: "#d6c0ff" }[card.spell]; g.lineWidth = 2; g.shadowColor = g.strokeStyle; g.shadowBlur = 12;
    for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(w / 2, h * 0.45, 10 + i * 11, 0, Math.PI * 2); g.stroke(); }
    g.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; g.moveTo(w / 2, h * 0.45); g.lineTo(w / 2 + Math.cos(a) * 40, h * 0.45 + Math.sin(a) * 40); } g.stroke();
  }

}

function portrait(npc, w = 320, h = 260) {
  const key = "npc" + npc.id + w; if (artCache.has(key)) return artCache.get(key);

  g.fillStyle = "#0a070c";

  g.beginPath(); g.ellipse(w / 2, h * 0.42, w * 0.13, h * 0.17, 0, 0, Math.PI * 2); g.fill();
  if (npc.hood) { g.beginPath(); g.moveTo(w * 0.33, h * 0.55); g.quadraticCurveTo(w / 2, h * 0.05, w * 0.67, h * 0.55); g.closePath(); g.fill(); }
  if (npc.beard) { g.beginPath(); g.moveTo(w * 0.42, h * 0.48); g.lineTo(w / 2, h * 0.7); g.lineTo(w * 0.58, h * 0.48); g.fill(); }
  if (npc.bird) { g.beginPath(); g.ellipse(w * 0.74, h * 0.6, 20, 13, -0.4, 0, Math.PI * 2); g.moveTo(w * 0.7, h * 0.58); g.lineTo(w * 0.86, h * 0.48); g.lineTo(w * 0.8, h * 0.62); g.fill(); }

  artCache.set(key, c); return c;
}

function dailyOffers() {

      <button class="btn go" data-up="${cardSel}" ${max ? "disabled" : ""}>Subir nível · ${fmt(gold)} ${I.coin.replace("<svg", '<svg width="14" height="14" style="vertical-align:-2px"')}</button></div></div>`;
  }
  return win("Cartas", `<div class="h3"><span>Baralho em uso</span><span>Mana média ${avg}</span></div>
    <div class="grid six">${Array.from({ length: 6 }, (_, i) => deck[i] ? cardTile(deck[i], { attr: `data-slot="${i}"`, sel: deckSlot === i }) : `<button class="cv empty" data-slot="${i}" aria-label="Espaço vazio"></button>`).join("")}</div>
    <p class="note">${pendingUse ? `Toca na carta do baralho que dá lugar a ${CARD[pendingUse].name}.` : deckSlot !== null ? "Escolhe na coleção a carta que entra neste lugar." : "Toca numa carta do baralho para a trocar, ou numa carta da coleção para ver detalhes."}</p>
    <div class="h3"><span>Coleção</span><span>${ids.length}/${CARDS.length}</span></div>
    <div class="grid">${ids.map(id => cardTile(id, { attr: `data-card-sel="${id}"`, sel: cardSel === id, name: true })).join("")}${CARDS.filter(c => !P.cards[c.id]).map(c => `<div class="cv empty" title="Por descobrir"></div>`).join("")}</div>
    ${detail}`);
}
function mapView() {
  const regions = [
    { name: "Cripta do Sino", x: 50, y: 74, open: true, prog: `${P.best}/10` },
    { name: "Pântano Febril", x: 26, y: 52 }, { name: "Picos de Geada", x: 72, y: 40 },
    { name: "Bosque Calado", x: 30, y: 25 }, { name: "Fornalha Cinzenta", x: 70, y: 14 },
  ];
  return win("Mapa do mundo", `<div class="diff"><span style="color:var(--muted)">◀</span> Dificuldade: Normal <span style="color:var(--muted)">▶</span></div>
    <div class="parch" data-paint="parch">${regions.map(r => r.open
      ? `<button class="region open" style="left:${r.x}%;top:${r.y}%" data-open="zone">${r.name}<small>${r.prog} · entrar</small></button>`
      : `<div class="region locked" style="left:${r.x}%;top:${r.y}%">${r.name}<small>em breve</small></div>`).join("")}</div>`);
}
function zoneView() {
  const pts = [[50, 92], [28, 82], [44, 71], [70, 63], [52, 53], [26, 45], [40, 34], [66, 27], [46, 18], [50, 7]];
  return win("Cripta do Sino", `<p class="sub">Dez fases. A 5 guarda um ogro e a 10 o Senhor do Sino Partido.</p>
    <div class="zone" data-paint="zone">${pts.map(([x, y], i) => {
      const n = i + 1, S = stageDef(n), done = n <= P.best, openN = n <= P.best + 1, st = P.stars[n] || 0;
      return `<button class="znode${done ? " done" : ""}${n === P.best + 1 ? " next" : ""}${S.boss ? " boss" : ""}" style="left:${x}%;top:${y}%" data-stage="${n}" ${openN ? "" : "disabled"} aria-label="${S.name}">${S.boss ? "☠" : n}${done ? `<span class="stars">${"◆".repeat(st)}${"◇".repeat(3 - st)}</span>` : ""}</button>`;
    }).join("")}</div>`, "", { back: "map" });
}
function deckView() {
  const S = stageDef(selStage), owned = Object.keys(P.cards);
  const foes = [...new Set(S.pool.concat(S.mini ? ["ogre"] : [], S.boss ? ["boss"] : []))];
  return win(`${S.n}. ${S.name}`, `<p class="sub">Tempo limite ${Math.floor(S.timeLimit / 60)}:${String(S.timeLimit % 60).padStart(2, "0")}. Inimigos nesta fase:</p>
    <div class="foes">${foes.map(f => `<span class="chip" style="border-color:${UNIT_TYPES[f].eye}66">${UNIT_TYPES[f].name}</span>`).join("")}</div>
    <div class="h3"><span>Baralho</span><span>${pendingDeck.length}/6</span></div>
    <div class="grid">${owned.sort((a, b) => CARD[a].cost - CARD[b].cost).map(id => cardTile(id, { sel: pendingDeck.includes(id), attr: `data-pick="${id}"`, name: true, noArrow: true })).join("")}</div>`,
    `<button class="btn" data-open="zone">Voltar</button><button class="btn red" data-start ${pendingDeck.length === 6 ? "" : "disabled"}>Entrar na cripta</button>`, { full: true });
}
function villageView() {
  return win("Vila", `<div class="sign">Vila de Cinzaval</div>
    <div class="shops">${NPCS.map(n => `<button class="shop" data-open="npc:${n.id}" data-portrait="${n.id}"><div class="lab"><b>${n.shop}</b><span>${n.desc}</span></div></button>`).join("")}</div>
    <p class="note">Comprar e conversar com os mercadores sobe a afinidade, que abre mais ofertas.</p>`);
}
function hearts(id) { const a = Math.min(5, Math.floor(P.affinity[id] / 2)); return `<span class="hearts">${"♥".repeat(a)}<span class="off">${"♥".repeat(5 - a)}</span></span>`; }
function npcView() {
  const n = NPC[npcId];
  const opts = {
    ilsa: [["shop", "Negociar cartas", I.book], ["altar", "Livros de invocação", I.crystal], ["talk", "Conversar", I.mask]],
    brenna: [["soon", "Ver poções", I.scroll], ["talk", "Conversar", I.mask]],
    gorm: [["soon", "Fabricar", I.claw], ["soon", "Modificar", I.gear], ["talk", "Conversar", I.mask]],
    kael: [["soon", "Pacotes de gemas", I.gem], ["talk", "Conversar", I.mask]],
  }[n.id];
  return win(n.shop, `<div class="npc"><div class="portrait" data-portrait="${n.id}"></div>
    <div><div class="nm">${n.name}</div>${hearts(n.id)}</div>
    <div class="speech">${n.lines[npcLine]}</div>
    <div class="opts">${opts.map(([k, label, ic]) => `<button class="btn" data-npc="${k}"><span style="width:20px;display:inline-grid">${ic.replace("<svg", '<svg width="20" height="20"')}</span>${label}</button>`).join("")}</div></div>`, "", { back: "village" });
}
function shopView() {
  const offers = dailyOffers();
  const left = new Date(); left.setHours(24, 0, 0, 0); const mins = Math.round((left - Date.now()) / 60000);
  return win("Loja de cartas", `<div class="h3"><span>Cartas de hoje</span><span class="timer">renova em ${Math.floor(mins / 60)}h ${mins % 60}m</span></div>
    ${offers.map(o => { const sold = P.bought.ids.includes(o.id); return `<div class="offer">${cardTile(o.id, { label: "x" + o.qty, noArrow: true })}
      <div class="t"><b>${CARD[o.id].name}</b><span>${RARITY[CARD[o.id].rarity]} · ${o.qty} cópias</span></div>
      <button class="btn go sm" data-buy="${o.id}" ${sold || P.gold < o.price ? "disabled" : ""}>${sold ? "Vendido" : fmt(o.price) + " ouro"}</button></div>`; }).join("")}
    <div class="h3"><span>Livros de invocação</span><span>lendária garantida em ${LEGEND_PITY - P.pity}</span></div>
    <p class="sub">${RARITY.map((r, i) => `${r} ${Math.round(DRAW_RATES[i] * 100)}%`).join(" · ")}. O livro grátis do dia nunca dá lendárias.</p>
    <div class="win-f" style="padding:0;border:0">
      <button class="btn" data-draw="free" ${P.freeDay !== today() ? "" : "disabled"}>${P.freeDay !== today() ? "Grátis hoje" : "Grátis amanhã"}</button>
      <button class="btn purple" data-draw="1" ${P.crystals >= DRAW_COST ? "" : "disabled"}>x1 · ${DRAW_COST}</button>
      <button class="btn red" data-draw="10" ${P.crystals >= DRAW10_COST ? "" : "disabled"}>x10 · ${DRAW10_COST}</button></div>
    ${lastPull ? `<div class="h3"><span>Resultado</span></div><div class="grid">${lastPull.map(r => cardTile(r.c.id, { label: r.isNew ? "Nova!" : "+1", name: true, noArrow: true })).join("")}</div>` : ""}`, "", { back: "npc:ilsa" });
}
function optionsView() {
  return win("Opções", `<p class="sub">O progresso fica guardado só neste browser.</p>
    <button class="btn red" data-reset>${resetArm ? "Toca outra vez para apagar tudo" : "Apagar progresso"}</button>`);
}
let resetArm = false, soonName = "";
function soonView() {
  const t = TABS.find(x => x.name === soonName);
  const text = { Desafio: "Masmorras diárias de ouro, cartas e equipamento, com tentativas limitadas.", Arena: "Ataca a defesa de outros jogadores, controlada pela IA, e sobe de liga.", "Clã": "Junta-te a um clã, conversa e gira a roda de prémios do clã." }[soonName] || "Esta parte ainda não foi construída.";
  return win(soonName, `<div class="soonbox">${t ? I[t.icon] : I.scroll}<h3>Em breve</h3><p class="sub">${text}</p></div>`);
}
function battleView() {
  const S = run.stage, groups = run.groupCount;
  return `<div class="hud">
    <div class="hud-top">
      <div><div class="waves"><div class="l">Emboscadas</div><div class="pips" id="pips">${Array.from({ length: groups }, (_, i) => `<span class="pip${S.boss && i === groups - 1 ? " boss" : ""}"></span>`).join("")}</div></div>
        <div class="herohp"><i id="hpFill"></i><span id="hpText"></span></div></div>
      <div class="tright"><div class="time" id="timeBox"><div class="l">Tempo restante</div><b id="time">0:00</b></div>
        <button class="menu-btn" id="menu" aria-label="Menu">${I.menu}</button></div>
    </div>
    <div class="stage-name">${S.n}. ${S.name}</div>
    <div class="hud-bottom">
      <div class="manabar">${I.crystal.replace("<svg", '<svg class="crystal"')}<div class="bar"><i id="manaFill"></i><span id="manaText"></span></div></div>
      <div class="deck">${run.cards.map((c, i) => `<button class="dc r${c.def.rarity}" data-card="${i}" id="dc${i}" data-art="${c.def.id}" aria-label="${c.def.name}"><span class="hex">${c.def.cost}</span><span class="cd" id="cd${i}"></span><span class="lvband">Nv ${c.level}<b>${c.def.name}</b></span></button>`).join("")}</div>
    </div>
    ${paused ? `<div class="result"><h2>Menu</h2><p>A fase está em pausa.</p><div class="btns"><button class="btn go" id="resume">Continuar</button><button class="btn" id="spd">Velocidade ${speedMul}x</button><button class="btn red" id="quit">Desistir</button></div></div>` : ""}
  </div>`;
}
function resultView() {
  const r = lastResult, copies = Object.entries(r.copies).map(([id, n]) => `${n}× ${CARD[id].name}`).join(", ");
  return `<div class="result${r.win ? "" : " lose"}"><h2>${r.win ? "Vitória" : r.timedOut ? "Tempo esgotado" : "A Sera caiu"}</h2>
    ${r.win ? `<div style="color:var(--gold);font-size:22px;letter-spacing:4px">${"◆".repeat(r.stars)}${"◇".repeat(3 - r.stars)}</div>` : ""}
    <p>+${fmt(r.gold)} ouro · +${r.xp} XP${r.crystals ? ` · +${r.crystals} gemas` : ""}${copies ? `<br>Cartas: ${copies}` : ""}${r.levelUp ? `<br><b>A Sera subiu para o nível ${P.heroLevel}!</b>` : ""}</p>
    ${r.win ? "" : `<p>Leva tanques para a frente, guarda mana para as emboscadas e foca os atiradores primeiro.</p>`}
    <div class="btns"><button class="btn" data-open="lobby">Lobby</button><button class="btn go" data-open="zone">Continuar</button></div></div>`;
}

// Painted backdrops for the parchment map and the zone path.
const PAINTERS = {
  parch(el) {
    const c = document.createElement("canvas"), w = 360, h = 480; c.width = w; c.height = h; const g = c.getContext("2d"); const r = rng(5);
    g.strokeStyle = "rgba(60,40,20,0.5)"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(40, 80); for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; g.lineTo(w / 2 + Math.cos(a) * (140 + r() * 30), h / 2 + Math.sin(a) * (200 + r() * 30)); } g.closePath(); g.stroke();
    g.fillStyle = "rgba(60,40,20,0.12)"; g.fill();
    g.setLineDash([4, 6]); g.beginPath(); g.moveTo(w * 0.5, h * 0.74); g.quadraticCurveTo(w * 0.3, h * 0.62, w * 0.26, h * 0.52); g.quadraticCurveTo(w * 0.6, h * 0.45, w * 0.72, h * 0.4); g.quadraticCurveTo(w * 0.4, h * 0.3, w * 0.3, h * 0.25); g.quadraticCurveTo(w * 0.55, h * 0.18, w * 0.7, h * 0.14); g.stroke(); g.setLineDash([]);
    g.fillStyle = "rgba(40,25,10,0.5)"; for (let i = 0; i < 14; i++) { const x = r() * w, y = r() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 8, y - 14); g.lineTo(x + 16, y); g.fill(); }
    const fog = g.createRadialGradient(w / 2, h / 2, w * 0.3, w / 2, h / 2, w * 0.8); fog.addColorStop(0, "#0000"); fog.addColorStop(1, "rgba(20,14,8,0.5)"); g.fillStyle = fog; g.fillRect(0, 0, w, h);
    el.prepend(c);
  },
  zone(el) {
    const c = document.createElement("canvas"), w = 300, h = 440; c.width = w; c.height = h; const g = c.getContext("2d");
    const pts = [[50, 92], [28, 82], [44, 71], [70, 63], [52, 53], [26, 45], [40, 34], [66, 27], [46, 18], [50, 7]].map(([x, y]) => [x / 100 * w, y / 100 * h]);
    g.strokeStyle = "#3a2e28"; g.lineWidth = 14; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
    g.strokeStyle = "#5a4632"; g.lineWidth = 2; g.setLineDash([3, 5]); g.stroke(); g.setLineDash([]);
    const r = rng(9); g.fillStyle = "rgba(0,0,0,0.5)"; for (let i = 0; i < 30; i++) { const x = r() * w, y = r() * h; g.beginPath(); g.arc(x, y, 3 + r() * 8, 0, 7); g.fill(); }
    el.prepend(c);
  },
};

function updateHud() {
  const h = run.hero;
  $("hpFill").style.width = (100 * h.hp / h.maxHp) + "%"; $("hpText").textContent = `Sera ${h.hp}/${h.maxHp}`;
  $("manaFill").style.width = (100 * run.mana / run.maxMana) + "%"; $("manaText").textContent = `${Math.floor(run.mana)} / MAX ${run.maxMana}`;
  const left = Math.max(0, Math.ceil(run.timeLimit - run.t));
  $("time").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  $("timeBox").classList.toggle("low", left <= 30);
  const pips = $("pips").children; for (let i = 0; i < pips.length; i++) pips[i].classList.toggle("on", i < run.ambushes);
  run.cards.forEach((c, i) => {
    const el = $("dc" + i); if (!el) return;
    $("cd" + i).style.transform = `scaleY(${c.cd / c.def.cd})`;
    el.classList.toggle("poor", run.mana < c.def.cost);
    el.classList.toggle("ready", run.mana >= c.def.cost && c.cd === 0);
  });
}

function bind() {
  const on = (sel, fn) => ui.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
  on("[data-tab]", b => { const t = TABS.find(x => x.id === b.dataset.tab); if (tab === t.id && view !== "lobby") { tab = null; return open("lobby"); } tab = t.id; if (t.soon) { soonName = t.name; return open("soon"); } cardSel = null; deckSlot = null; open(t.id); });
  on("[data-open]", b => { const v = b.dataset.open; if (v === "lobby") tab = null; if (v === "zone" || v === "map") tab = "map"; if (v === "village" || v.startsWith("npc")) tab = null; open(v); });
  on("[data-close]", () => { tab = null; open("lobby"); });
  on("[data-soon]", b => { soonName = b.dataset.soon; tab = null; open("soon"); });
  on("[data-stage]", b => { selStage = +b.dataset.stage; pendingDeck = P.deck.filter(id => P.cards[id]).slice(0, 6); open("deck"); });
  on("[data-pick]", b => {
    const id = b.dataset.pick, i = pendingDeck.indexOf(id);
    if (i >= 0) pendingDeck.splice(i, 1); else if (pendingDeck.length < 6) pendingDeck.push(id); else return toast("O baralho já tem 6 cartas.");
    render();
  });
  on("[data-start]", () => { P.deck = pendingDeck.slice(); save(); startRun(selStage); });
  on("[data-slot]", b => {
    const i = +b.dataset.slot;
    if (pendingUse) { P.deck = P.deck.filter(id => P.cards[id]); P.deck[i] = pendingUse; P.deck = P.deck.filter(Boolean); toast(`${CARD[pendingUse].name} entrou no baralho.`); pendingUse = null; save(); return render(); }
    deckSlot = deckSlot === i ? null : i; render();
  });
  on("[data-card-sel]", b => {
    const id = b.dataset.cardSel;
    if (deckSlot !== null) { if (P.deck.includes(id)) return toast("Essa carta já está no baralho."); P.deck = P.deck.filter(x => P.cards[x]); P.deck[deckSlot] = id; P.deck = P.deck.filter(Boolean); deckSlot = null; save(); toast(`${CARD[id].name} entrou no baralho.`); }
    cardSel = id; render();
  });
  on("[data-use]", b => { const id = b.dataset.use; if (P.deck.includes(id)) return; deckSlot = null; pendingUse = id; render(); });
  on("[data-up]", b => {
    const id = b.dataset.up, o = P.cards[id], need = Prog.copiesToLevel(o.level), gold = Prog.goldToLevel(o.level);
    if (o.copies < need) return toast(`Faltam ${need - o.copies} cópias.`);
    if (P.gold < gold) return toast("Ouro insuficiente.");
    o.copies -= need; P.gold -= gold; o.level++; save(); toast(`${CARD[id].name} subiu para o nível ${o.level}.`); render();
  });
  on("[data-npc]", b => {
    const k = b.dataset.npc, n = NPC[npcId];
    if (k === "talk") { npcLine = (npcLine + 1) % n.lines.length; if (P.affinity[npcId] < 3) P.affinity[npcId]++; save(); render(); }
    else if (k === "shop" || k === "altar") open("shop");
    else toast("Em breve.");
  });
  on("[data-buy]", b => {
    const o = dailyOffers().find(x => x.id === b.dataset.buy);
    if (!o || P.bought.ids.includes(o.id) || P.gold < o.price) return;
    P.gold -= o.price; P.bought.ids.push(o.id); grantCard(P, o.id, o.qty); P.affinity.ilsa = Math.min(10, P.affinity.ilsa + 1);
    save(); toast(`+${o.qty} ${CARD[o.id].name}`); render();
  });
  on("[data-draw]", b => {
    const k = b.dataset.draw; let res;
    if (k === "free") { if (P.freeDay === today()) return; P.freeDay = today(); res = drawCards(P, 1, true); }
    else { const cost = k === "10" ? DRAW10_COST : DRAW_COST; if (P.crystals < cost) return toast("Gemas insuficientes."); P.crystals -= cost; res = drawCards(P, k === "10" ? 10 : 1, false); P.affinity.ilsa = Math.min(10, P.affinity.ilsa + 1); }
    lastPull = res.map(c => ({ c, isNew: grantCard(P, c.id) })); save(); render();
  });
  on("[data-reset]", () => { if (!resetArm) { resetArm = true; render(); return; } resetArm = false; P = newProfile(); P.affinity = { ilsa: 0, brenna: 0, gorm: 0, kael: 0 }; P.bought = { day: today(), ids: [] }; P.stars = {}; save(); tab = null; toast("Progresso apagado."); open("lobby"); });
  on("[data-card]", b => {
    if (!run || paused) return;
    const c = run.cards[+b.dataset.card];
    if (!run.playCard(+b.dataset.card)) toast(c.cd > 0 ? "Em recarga." : run.mana < c.def.cost ? "Mana insuficiente." : "Sem alvo por perto.");
  });
  const m = $("menu"); if (m) m.onclick = () => { paused = true; render(); };
  const re = $("resume"); if (re) re.onclick = () => { paused = false; render(); };
  const sp = $("spd"); if (sp) sp.onclick = () => { speedMul = speedMul === 1 ? 2 : 1; render(); };
  const qu = $("quit"); if (qu) qu.onclick = () => { paused = false; run.state = "lose"; endRun(); };
}

function startRun(n) {
  clearViews(); titleGroup = null;
  run = new Run(stageDef(n), P.deck, P);
  buildLevel(run);
  const evs = run.events; run.events = []; evs.forEach(present);
  camZ = run.hero.z; paused = false;
  view = "battle"; screen = "battle"; render();
}
function endRun() {
  const h = run.hero;
  lastResult = claimRun(P, run);
  lastResult.timedOut = run.timedOut;
  if (lastResult.win) { const stars = 1 + (h.hp > h.maxHp * 0.5 ? 1 : 0) + (run.t < run.timeLimit * 0.5 ? 1 : 0); lastResult.stars = stars; P.stars[run.stage.n] = Math.max(P.stars[run.stage.n] || 0, stars); }
  save();
  view = "result"; screen = "result"; render();
}

let screen = "home";
resize();
showTitleScene();
render();
requestAnimationFrame(frame);
</script>
