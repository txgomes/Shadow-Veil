<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120f24">
<title>Pacto dos Invocadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Figtree:wght@400;600;800&display=swap">
<style>
*{box-sizing:border-box} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0;font-size:14px} [hidden]{display:none!important}
</style>
<style>
/* Layout: one full-screen stage; the 3D arena sits behind, panels slide over it like a mobile gacha HUD. Single dark look by choice. */
:root {
  --night: #120f24;
  --veil: #1d1838;
  --panel: rgba(29, 24, 56, 0.92);
  --line: #3a3366;
  --ink: #ece8ff;
  --muted: #a49cd0;
  --gold: #f2c35b;
  --mana: #5fa8ff;
  --hp: #58d68d;
  --foe: #ef6a6a;
  --display: "Marcellus SC", "Palatino Linotype", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
#app { position: relative; height: 100%; display: flex; flex-direction: column; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
#overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.bar-hp { position: absolute; width: 64px; height: 7px; background: #000a; border-radius: 4px; transform: translate(-50%, -50%); overflow: hidden; }
.bar-hp i { display: block; height: 100%; background: var(--hp); }
.bar-hp.foe i { background: var(--foe); }
.bar-hp b { position: absolute; left: 0; top: 0; height: 2px; background: #9fd3ff; }
.pop { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 20px; text-shadow: 0 2px 0 #000, 0 0 6px #000; animation: rise 0.9s ease-out forwards; white-space: nowrap; }
@keyframes rise { to { transform: translate(-50%, -150%); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pop { animation-duration: 0.01s; } }

header.top { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--night), transparent); }
.brand { font-family: var(--display); font-size: 20px; letter-spacing: 0.04em; color: var(--gold); margin-right: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #0008; border: 1px solid var(--line); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn { background: var(--veil); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--gold); color: #2a1c00; border-color: var(--gold); }

main { position: relative; z-index: 2; flex: 1; min-height: 0; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 14px; pointer-events: none; }
main > * { pointer-events: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; max-width: 760px; width: 100%; margin: auto; max-height: 100%; overflow: auto; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0 0 4px; text-wrap: balance; }
.panel p.sub { color: var(--muted); margin: 0 0 14px; line-height: 1.45; }

.home { margin: auto auto 6vh; display: grid; gap: 10px; width: min(320px, 100%); text-align: center; }
.home h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 7vw, 54px); margin: 0 0 6px; color: var(--gold); text-shadow: 0 3px 18px #000; text-wrap: balance; }
.home .tag { color: var(--muted); margin: 0 0 12px; text-shadow: 0 1px 6px #000; }
.home .btn { padding: 14px; font-size: 17px; }

.stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.stage-btn { text-align: left; padding: 10px; border-radius: 10px; background: var(--veil); border: 1px solid var(--line); display: grid; gap: 2px; }
.stage-btn strong { font-size: 15px; }
.stage-btn span { font-size: 12px; color: var(--muted); }
.stage-btn.done span { color: var(--gold); }
.stage-btn.boss { border-color: #7a4fbf; }
.stage-btn:disabled { opacity: 0.4; cursor: default; }

.roster { display: grid; gap: 8px; }
.card { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--veil); border: 1px solid var(--line); text-align: left; }
.card.in { border-color: var(--gold); }
.card .sw { width: 12px; height: 40px; border-radius: 6px; }
.card .meta { color: var(--muted); font-size: 12px; }
.card .stars { color: var(--gold); letter-spacing: 1px; }
.card .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.card .actions .btn { padding: 6px 10px; font-size: 13px; }

.rates { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.pulls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.res { border-radius: 10px; padding: 10px; text-align: center; border: 1px solid var(--line); background: var(--veil); animation: flip 0.35s ease-out both; }
.res.r5 { border-color: var(--gold); box-shadow: 0 0 16px #f2c35b66; }
.res.r4 { border-color: #b98cff; }
.res .stars { color: var(--gold); font-size: 13px; }
.res .new { font-size: 11px; color: var(--hp); }
@keyframes flip { from { transform: rotateY(90deg); } }

.hud { margin-top: auto; display: grid; gap: 8px; }
.hud-top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
.mana { position: relative; height: 18px; border-radius: 9px; background: #000a; border: 1px solid var(--line); overflow: hidden; }
.mana i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #3d6fd9, var(--mana)); }
.mana span { position: relative; display: block; text-align: center; font-size: 12px; line-height: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.portraits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.por { position: relative; border-radius: 12px; padding: 8px; min-height: 84px; background: var(--panel); border: 2px solid var(--line); text-align: left; display: grid; align-content: space-between; gap: 4px; overflow: hidden; }
.por.ready { border-color: var(--mana); box-shadow: 0 0 12px #5fa8ff66; }
.por:disabled { cursor: default; }
.por.dead { opacity: 0.35; }
.por .nm { font-weight: 800; font-size: 14px; }
.por .sk { font-size: 11px; color: var(--muted); line-height: 1.2; }
.por .cost { position: absolute; top: 6px; right: 8px; font-size: 12px; font-weight: 800; color: var(--mana); }
.por .hpl { height: 4px; border-radius: 2px; background: #0008; overflow: hidden; }
.por .hpl i { display: block; height: 100%; background: var(--hp); }
.por .tint { position: absolute; inset: auto 0 0 0; height: 3px; }

.result { text-align: center; }
.result h2 { font-size: 36px; color: var(--gold); }
.result.lose h2 { color: var(--foe); }
.result .btn { margin-top: 12px; }
.toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: #000c; border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; z-index: 5; }
.legend { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.5; }
@media (max-width: 520px) {
  .portraits { gap: 6px; }
  .por { padding: 6px; min-height: 76px; }
  .por .sk { display: none; }
  .brand { font-size: 17px; }
}
</style>
</head>
<body>

<div id="app">
  <div id="stage"></div>
  <div id="overlay"></div>
  <header class="top">
    <div class="brand">Pacto dos Invocadores</div>
    <span class="chip"><span class="dot" style="background:var(--gold)"></span><span id="gold">0</span> ouro</span>
    <span class="chip"><span class="dot" style="background:#b98cff"></span><span id="crystals">0</span> cristais</span>
    <button class="btn" id="back" hidden>Voltar</button>
  </header>
  <main id="screen"></main>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Logic (port of Assets/_Project/Scripts/Logic) ----------
const ELEMENTS = { Fire: "Fogo", Wind: "Vento", Earth: "Terra", Water: "Água", Light: "Luz", Shadow: "Sombra" };
const ROLES = { Tank: "Tanque", Attacker: "Atacante", Support: "Suporte", Control: "Controle" };
const BEATS = { Fire: "Wind", Wind: "Earth", Earth: "Water", Water: "Fire", Light: "Shadow", Shadow: "Light" };
function elemMult(a, d) {
  if (BEATS[a] === d) return 1.3;
  if (BEATS[d] === a && a !== "Light" && a !== "Shadow") return 0.8;
  return 1;
}
function damage(atk, power, def, ea, ed) {
  return Math.max(1, Math.round(atk * power * (100 / (100 + Math.max(0, def))) * elemMult(ea, ed)));
}
const Lv = {
  teamSize: 4, maxStars: 6,
  cap: s => Math.min(s, 6) * 10,
  xpToNext: l => 50 + l * l * 10,
  scale: (l, s) => (1 + 0.06 * (l - 1)) * (1 + 0.15 * (s - 1)),
  shardsToStar: s => s * 10, goldToStar: s => s * 5000, shardsPerDup: r => r * 5,
  addXp(c, xp) {
    const start = c.level, cap = Lv.cap(c.stars);
    c.xp += xp;
    while (c.level < cap && c.xp >= Lv.xpToNext(c.level)) { c.xp -= Lv.xpToNext(c.level); c.level++; }
    if (c.level >= cap) c.xp = 0;
    return c.level - start;
  },
  canStar: (c, gold) => c.stars < 6 && c.shards >= Lv.shardsToStar(c.stars) && gold >= Lv.goldToStar(c.stars),
};

const CREATURES = [
  ["brasa", "Brasa", 3, "Fire", "Attacker", "Front", 900, 130, 40, 1.0, "Garra Ardente", "Strike", 3, 3.0, "#E8553A"],
  ["ignar", "Ignar", 5, "Fire", "Attacker", "Back", 850, 170, 35, 1.3, "Chuva de Cinzas", "AreaStrike", 5, 2.2, "#FF8A3D"],
  ["zefira", "Zéfira", 4, "Wind", "Support", "Back", 800, 90, 45, 1.2, "Brisa Restauradora", "Heal", 4, 2.0, "#7BD88F"],
  ["corvento", "Corvento", 2, "Wind", "Attacker", "Front", 850, 115, 40, 0.9, "Rasante", "Strike", 3, 2.6, "#4FBF73"],
  ["rochedo", "Rochedo", 3, "Earth", "Tank", "Front", 1600, 70, 90, 1.4, "Muralha de Pedra", "Shield", 3, 2.0, "#A67C52"],
  ["musgo", "Musgo", 1, "Earth", "Support", "Back", 900, 70, 50, 1.3, "Esporos", "Heal", 3, 1.5, "#6B8E3A"],
  ["mare", "Maré", 3, "Water", "Control", "Back", 950, 100, 50, 1.2, "Correnteza", "Stun", 4, 1.8, "#3A8EE8"],
  ["nereia", "Nereia", 4, "Water", "Tank", "Front", 1500, 85, 80, 1.3, "Bolha Protetora", "Shield", 3, 2.2, "#5EC8F2"],
  ["aurelia", "Aurélia", 5, "Light", "Support", "Back", 950, 110, 55, 1.2, "Bênção Solar", "Heal", 5, 3.0, "#F7D96B"],
  ["lumen", "Lúmen", 2, "Light", "Attacker", "Front", 900, 120, 45, 1.1, "Lança de Luz", "Strike", 3, 2.8, "#FFF2B0"],
  ["umbra", "Umbra", 4, "Shadow", "Control", "Back", 900, 125, 45, 1.1, "Grilhões Sombrios", "Stun", 4, 2.0, "#7A4FBF"],
  ["noctis", "Nóctis", 1, "Shadow", "Attacker", "Front", 800, 105, 35, 1.0, "Mordida Noturna", "Strike", 3, 2.4, "#4B2E6F"],
].map(([id, name, rarity, element, role, row, hp, atk, def, interval, skillName, skill, cost, power, tint]) =>
  ({ id, name, rarity, element, role, row, hp, atk, def, interval, skillName, skill, cost, power, tint }));
const byId = Object.fromEntries(CREATURES.map(c => [c.id, c]));
const STARTER = ["rochedo", "brasa", "zefira", "mare"];

function statsOf(def, level, stars) {
  const k = Lv.scale(level, stars);
  return { id: def.id, name: def.name, element: def.element, role: def.role, row: def.row,
    maxHp: Math.round(def.hp * k), atk: Math.round(def.atk * k), def: Math.round(def.def * k),
    interval: def.interval, skill: def.skill, cost: def.cost, power: def.power };
}

const STAGES = Array.from({ length: 15 }, (_, i) => {
  const n = i + 1, boss = n === 15, level = 1 + Math.floor((n - 1) * 1.3), waves = [];
  for (let w = 0; w < 3; w++) {
    const count = Math.min(2 + w + Math.floor(n / 7), 4), wave = [];
    for (let j = 0; j < count; j++) wave.push({ id: CREATURES[(n * 3 + w * 2 + j) % CREATURES.length].id, level: level + w, stars: 1 });
    waves.push(wave);
  }
  if (boss) waves.push([{ id: "umbra", level: level + 6, stars: 4 }]);
  return { n, boss, name: boss ? "Guardião do Véu" : `Fase ${n}`, waves, gold: 150 + n * 30, xp: 40 + n * 15, crystals: 50 };
});

class Unit {
  constructor(s, side, slot) { Object.assign(this, { s, side, slot, hp: s.maxHp, shield: 0, stun: 0, timer: s.interval, casts: 0 }); }
  get alive() { return this.hp > 0; }
  take(n) { const a = Math.min(this.shield, n); this.shield -= a; const d = Math.min(this.hp, n - a); this.hp -= d; return d; }
  heal(n) { if (!this.alive) return 0; const h = Math.min(this.s.maxHp - this.hp, n); this.hp += h; return h; }
}

class Battle {
  constructor(team, waves) {
    this.players = team.map((s, i) => new Unit(s, "P", i));
    this.waves = waves; this.wave = -1; this.enemies = [];
    this.mana = { cur: 3, max: 10, regen: 0.5 };
    this.state = "run"; this.events = [];
    this.nextWave();
  }
  tick(dt) {
    if (this.state !== "run") return;
    this.mana.cur = Math.min(this.mana.max, this.mana.cur + this.mana.regen * dt);
    for (const u of [...this.players, ...this.enemies].filter(u => u.alive)) {
      if (this.state !== "run") return;
      if (!u.alive) continue;
      u.stun = Math.max(0, u.stun - dt);
      if (u.stun > 0) continue;
      u.timer -= dt;
      if (u.timer > 0) continue;
      u.timer += u.s.interval;
      if (u.side === "E" && ++u.casts % 4 === 0) this.skill(u); else this.attack(u);
      this.checkEnd();
    }
  }
  canCast(i) { const u = this.players[i]; return this.state === "run" && u && u.alive && u.stun <= 0 && this.mana.cur >= u.s.cost; }
  cast(i) {
    if (!this.canCast(i)) return false;
    const u = this.players[i]; this.mana.cur -= u.s.cost; this.skill(u); this.checkEnd(); return true;
  }
  foes(u) { return u.side === "P" ? this.enemies : this.players; }
  allies(u) { return u.side === "P" ? this.players : this.enemies; }
  front(list) { const a = list.filter(u => u.alive); return a.find(u => u.s.row === "Front") || a[0]; }
  attack(u) {
    const t = this.front(this.foes(u)); if (!t) return;
    this.hit(u, t, damage(u.s.atk, 1, t.s.def, u.s.element, t.s.element), "attack");
    if (u.side === "P") this.mana.cur = Math.min(this.mana.max, this.mana.cur + 0.2);
  }
  skill(u) {
    const s = u.s, foes = this.foes(u), allies = this.allies(u);
    const dmg = t => damage(s.atk, s.power, t.s.def, s.element, t.s.element);
    this.events.push({ kind: "cast", src: u });
    if (s.skill === "Strike") { const t = foes.filter(x => x.alive).sort((a, b) => a.hp - b.hp)[0]; if (t) this.hit(u, t, dmg(t), "skill"); }
    else if (s.skill === "AreaStrike") foes.filter(x => x.alive).forEach(t => this.hit(u, t, dmg(t), "skill"));
    else if (s.skill === "Heal") allies.filter(x => x.alive).forEach(a => this.events.push({ kind: "heal", src: u, tgt: a, n: a.heal(Math.floor(s.atk * s.power)) }));
    else if (s.skill === "Shield") allies.filter(x => x.alive).forEach(a => { const n = Math.floor(s.maxHp * 0.1 * s.power); a.shield += n; this.events.push({ kind: "shield", src: u, tgt: a, n }); });
    else if (s.skill === "Stun") { const t = this.front(foes); if (t) { this.hit(u, t, dmg(t), "skill"); if (t.alive) { t.stun = Math.max(t.stun, s.power); this.events.push({ kind: "stun", src: u, tgt: t }); } } }
  }
  hit(src, tgt, n, kind) {
    const d = tgt.take(n);
    this.events.push({ kind, src, tgt, n: d });
    if (!tgt.alive) this.events.push({ kind: "death", src, tgt });
  }
  checkEnd() {
    if (this.state !== "run") return;
    if (this.players.every(u => !u.alive)) { this.state = "lose"; return; }
    if (this.enemies.every(u => !u.alive)) { if (this.wave + 1 >= this.waves.length) this.state = "win"; else this.nextWave(); }
  }
  nextWave() {
    this.wave++;
    this.enemies = this.waves[this.wave].map((s, i) => new Unit(s, "E", i));
    this.events.push({ kind: "wave" });
  }
}

const RATES = [0, 0.35, 0.25, 0.30, 0.08, 0.02], PITY = 80, COST1 = 100, COST10 = 900;
const pool = r => { for (let k = r; k >= 1; k--) { const l = CREATURES.filter(c => c.rarity === k); if (l.length) return l[Math.floor(Math.random() * l.length)]; } return CREATURES[0]; };
function pull(profile, count) {
  const out = [];
  for (let i = 0; i < count; i++) {
    let r;
    if (profile.pity + 1 >= PITY) r = 5;
    else { const x = Math.random(); let acc = 0; r = 1; for (let k = 5; k >= 1; k--) { acc += RATES[k]; if (x < acc) { r = k; break; } } }
    const c = pool(r);
    profile.pity = c.rarity === 5 ? 0 : profile.pity + 1;
    out.push(c);
  }
  if (count >= 10 && out.every(c => c.rarity < 4)) out[count - 1] = pool(4);
  return out;
}

// ---------- Profile (local, per browser) ----------
const KEY = "pacto-profile-v1";
function newProfile() {
  const p = { gold: 1000, crystals: 1500, best: 0, creatures: [], team: [], pity: 0 };
  STARTER.forEach(id => grant(p, id));
  return p;
}
function grant(p, id) {
  const def = byId[id], own = p.creatures.find(c => c.id === id);
  if (own) { own.shards += Lv.shardsPerDup(def.rarity); return false; }
  p.creatures.push({ id, level: 1, xp: 0, stars: def.rarity, shards: 0 });
  if (p.team.length < Lv.teamSize) p.team.push(id);
  return true;
}
function load() { try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
let P = window.claude?.hot?.data?.profile || load() || newProfile();
window.claude?.hot?.snapshot?.(() => ({ profile: P }));

// ---------- 3D arena ----------
const stageEl = document.getElementById("stage"), overlay = document.getElementById("overlay");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
stageEl.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#120f24");
scene.fog = new THREE.Fog("#120f24", 16, 34);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
scene.add(new THREE.HemisphereLight("#b9b0ff", "#2a2040", 0.75));
const sun = new THREE.DirectionalLight("#fff1d6", 0.9); sun.position.set(-4, 10, 6); scene.add(sun);

const gradTex = (() => { const d = new Uint8Array([90, 170, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.LuminanceFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const toon = color => new THREE.MeshToonMaterial({ color, gradientMap: gradTex });
const outlineMat = new THREE.MeshBasicMaterial({ color: "#0b0816", side: THREE.BackSide });

// Arena: a round stone dais with a ring of runes.
const ground = new THREE.Mesh(new THREE.CylinderGeometry(9, 9.6, 0.6, 48), toon("#2d2650"));
ground.position.y = -0.3; scene.add(ground);
const ring = new THREE.Mesh(new THREE.TorusGeometry(7.2, 0.05, 6, 80), new THREE.MeshBasicMaterial({ color: "#6d5cc8" }));
ring.rotation.x = Math.PI / 2; ring.position.y = 0.02; scene.add(ring);
const motes = new THREE.Points(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(Array.from({ length: 360 }, () => (Math.random() - 0.5) * 26), 3)),
  new THREE.PointsMaterial({ color: "#c9b8ff", size: 0.06, transparent: true, opacity: 0.7 }));
scene.add(motes);

function withOutline(geo, color) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, toon(color)));
  const o = new THREE.Mesh(geo, outlineMat); o.scale.setScalar(1.08); g.add(o);
  return g;
}
// Placeholder silhouettes by role, tinted by creature.
function buildModel(def, big) {
  const g = new THREE.Group(), c = def.tint;
  if (def.role === "Tank") { const b = withOutline(new THREE.BoxGeometry(1.1, 1.3, 1.1), c); b.position.y = 0.65; g.add(b); }
  else if (def.role === "Attacker") { const b = withOutline(new THREE.ConeGeometry(0.55, 1.4, 6), c); b.position.y = 0.7; g.add(b); }
  else if (def.role === "Support") { const b = withOutline(new THREE.SphereGeometry(0.55, 20, 14), c); b.position.y = 0.75; g.add(b);
    const halo = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.05, 6, 24), new THREE.MeshBasicMaterial({ color: "#fff3b0" })); halo.position.y = 1.55; halo.rotation.x = Math.PI / 2; g.add(halo); }
  else { const b = withOutline(new THREE.OctahedronGeometry(0.62), c); b.position.y = 0.85; g.add(b); }
  const head = withOutline(new THREE.SphereGeometry(0.3, 16, 12), c); head.position.y = def.role === "Tank" ? 1.55 : 1.45; g.add(head);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), new THREE.MeshBasicMaterial({ color: "#ffffff" }));
  eye.position.set(0.24, head.position.y + 0.05, 0.1); g.add(eye);
  const eye2 = eye.clone(); eye2.position.z = -0.1; g.add(eye2);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.6, 20), new THREE.MeshBasicMaterial({ color: "#000", transparent: true, opacity: 0.35 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.01; g.add(shadow);
  if (big) g.scale.setScalar(1.6);
  return g;
}

let actors = [], battle = null, speed = 1, currentStage = null, idleTeam = [];
// Portrait layout like the genre: your team at the bottom, enemies at the top.
function homeFor(u) {
  const d = u.s.row === "Front" ? 1.9 : 3.9, x = (u.slot - 1.5) * 1.6;
  return new THREE.Vector3(x, 0, u.side === "P" ? d : -d);
}
function spawn(u, big) {
  const def = byId[u.s.id], m = buildModel(def, big);
  const home = homeFor(u); m.position.copy(home);
  m.rotation.y = u.side === "P" ? Math.PI / 2 : -Math.PI / 2;
  scene.add(m);
  const bar = document.createElement("div"); bar.className = "bar-hp" + (u.side === "E" ? " foe" : ""); bar.innerHTML = "<i></i><b></b>";
  overlay.appendChild(bar);
  const a = { u, m, home, lunge: 0, bar, phase: Math.random() * 6, fade: 1, big: !!big };
  actors.push(a); return a;
}
function removeActor(a) { scene.remove(a.m); a.bar.remove(); }
function clearArena() { actors.forEach(removeActor); actors = []; overlay.querySelectorAll(".pop").forEach(p => p.remove()); }
function showIdleTeam() {
  clearArena();
  P.team.forEach((id, i) => { const own = P.creatures.find(c => c.id === id); spawn(new Unit(statsOf(byId[id], own.level, own.stars), "P", i)).bar.hidden = true; });
}

const v = new THREE.Vector3();
function toScreen(pos) { v.copy(pos).project(camera); const r = renderer.domElement.getBoundingClientRect(); return [(v.x + 1) / 2 * r.width, (1 - v.y) / 2 * r.height]; }
function popup(a, text, color) {
  const [x, y] = toScreen(v.copy(a.m.position).setY(2.4));
  const el = document.createElement("div"); el.className = "pop"; el.textContent = text; el.style.color = color;
  el.style.left = x + "px"; el.style.top = y + "px"; overlay.appendChild(el);
  setTimeout(() => el.remove(), 950);
}
const find = u => actors.find(a => a.u === u);

function present(e) {
  if (e.kind === "wave") {
    actors.filter(a => a.u.side === "E").forEach(removeActor);
    actors = actors.filter(a => a.u.side !== "E");
    battle.enemies.forEach(u => spawn(u, currentStage.boss && battle.wave === battle.waves.length - 1));
    renderScreen(); return;
  }
  const src = e.src && find(e.src), tgt = e.tgt && find(e.tgt);
  if (src && (e.kind === "attack" || e.kind === "skill")) src.lunge = e.kind === "skill" ? 1.3 : 0.55;
  if (e.kind === "cast" && src && src.u.side === "P") flash(byId[src.u.s.id].tint);
  if (!tgt) return;
  if (e.kind === "attack") popup(tgt, e.n, "#ffffff");
  else if (e.kind === "skill") popup(tgt, e.n + "!", "#ffd166");
  else if (e.kind === "heal") popup(tgt, "+" + e.n, "#7dffa8");
  else if (e.kind === "shield") popup(tgt, "Escudo", "#9fd3ff");
  else if (e.kind === "stun") popup(tgt, "Atordoado", "#d2b0ff");
}
let flashT = 0, flashColor = new THREE.Color();
function flash(c) { flashT = 0.35; flashColor.set(c); }

function resize() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // Camera behind your team looking up the arena; narrow screens pull back to fit the width.
  const dist = camera.aspect < 0.75 ? 13 + (0.75 - camera.aspect) * 16 : 13;
  camera.position.set(0, dist * 0.8, dist * 0.75 + 3);
  camera.lookAt(0, 0, 1.2);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (battle) {
    battle.tick(dt * speed);
    const evs = battle.events; battle.events = [];
    evs.forEach(present);
    if (battle.state !== "run") finishBattle();
    else updateHud();
  }
  const t = now / 1000;
  for (const a of actors) {
    a.lunge = Math.max(0, a.lunge - dt * 4);
    const dir = a.u.side === "P" ? -1 : 1;
    a.m.position.z = a.home.z + dir * a.lunge;
    a.m.position.y = Math.sin(t * 2 + a.phase) * 0.05;
    if (a.u.stun > 0) a.m.rotation.z = Math.sin(t * 20) * 0.08; else a.m.rotation.z = 0;
    if (!a.u.alive) { a.fade = Math.max(0, a.fade - dt * 2.5); a.m.scale.setScalar(a.fade * (a.big ? 1.6 : 1)); }
    a.m.visible = a.fade > 0.02;
    if (!a.bar.hidden) {
      a.bar.style.display = a.u.alive ? "" : "none";
      const [x, y] = toScreen(v.copy(a.m.position).setY(a.big ? 3.3 : 2.1));
      a.bar.style.left = x + "px"; a.bar.style.top = y + "px";
      a.bar.firstChild.style.width = (100 * a.u.hp / a.u.s.maxHp) + "%";
      a.bar.lastChild.style.width = Math.min(100, 100 * a.u.shield / a.u.s.maxHp) + "%";
    }
  }
  ring.rotation.z += dt * 0.1;
  motes.rotation.y += dt * 0.02;
  if (flashT > 0) { flashT -= dt; scene.background.copy(flashColor).multiplyScalar(0.25 * Math.max(0, flashT) / 0.35).add(new THREE.Color("#120f24")); }
  else scene.background.set("#120f24");
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- Screens ----------
const $ = id => document.getElementById(id);
const screenEl = $("screen");
let screen = "home", lastPull = null, lastResult = null;
const stars = n => "★".repeat(n);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
function go(s) { screen = s; if (s === "home" || s === "team") showIdleTeam(); renderScreen(); }
$("back").onclick = () => go("home");

function renderScreen() {
  $("gold").textContent = P.gold.toLocaleString("pt-PT");
  $("crystals").textContent = P.crystals.toLocaleString("pt-PT");
  $("back").hidden = screen === "home" || screen === "battle";
  const h = { home: homeHtml, stages: stagesHtml, team: teamHtml, summon: summonHtml, battle: battleHtml, result: resultHtml }[screen]();
  screenEl.innerHTML = h;
  bind();
}

function homeHtml() {
  return `<div class="home">
    <h1>Pacto dos Invocadores</h1>
    <p class="tag">Protótipo jogável · fase máxima ${P.best}/15</p>
    <button class="btn primary" data-go="stages">Campanha</button>
    <button class="btn" data-go="team">Equipe</button>
    <button class="btn" data-go="summon">Invocar</button>
  </div>`;
}
function stagesHtml() {
  return `<div class="panel"><h2>Campanha</h2><p class="sub">Três ondas por fase. Toque no retrato de uma criatura para gastar mana na habilidade dela.</p>
    <div class="stages">${STAGES.map(s => {
      const done = s.n <= P.best, open = s.n <= P.best + 1;
      return `<button class="stage-btn${done ? " done" : ""}${s.boss ? " boss" : ""}" data-stage="${s.n}" ${open ? "" : "disabled"}>
        <strong>${s.boss ? "15 · " : ""}${s.name}</strong><span>${done ? "★ concluída" : open ? `inimigos nv ${s.waves[0][0].level}` : "bloqueada"}</span></button>`;
    }).join("")}</div></div>`;
}
function teamHtml() {
  const list = [...P.creatures].sort((a, b) => byId[b.id].rarity - byId[a.id].rarity);
  return `<div class="panel"><h2>Equipe ${P.team.length}/${Lv.teamSize}</h2>
    <p class="sub">Toque numa criatura para pôr ou tirar da equipe. Repetidas da invocação viram fragmentos; com fragmentos e ouro ela ganha uma estrela e o nível máximo sobe 10.</p>
    <div class="roster">${list.map(c => {
      const d = byId[c.id], inTeam = P.team.includes(c.id);
      return `<div class="card${inTeam ? " in" : ""}">
        <span class="sw" style="background:${d.tint}"></span>
        <div style="min-width:0"><strong>${d.name}</strong> <span class="stars">${stars(c.stars)}</span>
          <div class="meta">Nv ${c.level}/${Lv.cap(c.stars)} · ${ELEMENTS[d.element]} · ${ROLES[d.role]} · ${d.row === "Front" ? "frente" : "trás"} · ${d.skillName} (${d.cost} mana)</div>
          <div class="meta">Fragmentos ${c.shards}/${Lv.shardsToStar(c.stars)}</div></div>
        <div class="actions">
          <button class="btn" data-toggle="${c.id}">${inTeam ? "Tirar" : "Pôr"}</button>
          <button class="btn" data-star="${c.id}" ${Lv.canStar(c, P.gold) ? "" : "disabled"}>+★ ${(Lv.goldToStar(c.stars) / 1000)}k</button>
        </div></div>`;
    }).join("")}</div></div>`;
}
function summonHtml() {
  return `<div class="panel"><h2>Invocação</h2>
    <p class="sub">5★ garantido em até ${PITY} invocações (faltam ${PITY - P.pity}). A invocação x10 garante pelo menos uma 4★.</p>
    <div class="rates">${[5, 4, 3, 2, 1].map(r => `<span class="chip">${stars(r)} ${(RATES[r] * 100).toFixed(0)}%</span>`).join("")}</div>
    <div class="pulls">
      <button class="btn" data-pull="1" ${P.crystals < COST1 ? "disabled" : ""}>Invocar x1 · ${COST1}</button>
      <button class="btn primary" data-pull="10" ${P.crystals < COST10 ? "disabled" : ""}>Invocar x10 · ${COST10}</button>
    </div>
    ${lastPull ? `<div class="results">${lastPull.map((r, i) => `<div class="res r${r.c.rarity}" style="animation-delay:${i * 60}ms">
      <div style="height:6px;border-radius:3px;background:${r.c.tint};margin-bottom:6px"></div>
      <div class="stars">${stars(r.c.rarity)}</div><strong>${r.c.name}</strong>
      <div class="new">${r.isNew ? "nova!" : "+" + Lv.shardsPerDup(r.c.rarity) + " fragmentos"}</div></div>`).join("")}</div>` : ""}
    <p class="legend">Os cristais são ganhos na primeira vitória de cada fase. Neste protótipo não há compras.</p></div>`;
}
function battleHtml() {
  return `<div class="hud-top"><span class="chip">${currentStage.name} · onda ${battle.wave + 1}/${battle.waves.length}</span>
      <button class="btn" id="speed" style="padding:6px 12px">${speed > 1 ? "2x" : "1x"}</button></div>
    <div class="hud">
      <div class="mana"><i id="manaFill"></i><span id="manaText"></span></div>
      <div class="portraits">${battle.players.map((u, i) => `<button class="por" data-cast="${i}" id="por${i}">
        <span class="cost">${u.s.cost}</span><span class="nm">${u.s.name}</span><span class="sk">${byId[u.s.id].skillName}</span>
        <span class="hpl"><i></i></span><span class="tint" style="background:${byId[u.s.id].tint}"></span></button>`).join("")}</div>
    </div>`;
}
function resultHtml() {
  const r = lastResult;
  return `<div class="panel result${r.win ? "" : " lose"}"><h2>${r.win ? "Vitória" : "Derrota"}</h2>
    <p class="sub">${r.win ? `+${r.gold} ouro · +${r.xp} XP por criatura${r.crystals ? ` · +${r.crystals} cristais` : ""}${r.lv.length ? `<br>Subiram de nível: ${r.lv.join(", ")}` : ""}`
      : "Experimente outra formação, use as habilidades na hora certa ou evolua as criaturas."}</p>
    <button class="btn primary" data-go="stages">Continuar</button></div>`;
}

function updateHud() {
  const m = battle.mana, f = $("manaFill"); if (!f) return;
  f.style.width = (100 * m.cur / m.max) + "%";
  $("manaText").textContent = `Mana ${m.cur.toFixed(1)} / ${m.max}`;
  battle.players.forEach((u, i) => {
    const el = $("por" + i); if (!el) return;
    const ok = battle.canCast(i);
    el.disabled = !ok; el.classList.toggle("ready", ok); el.classList.toggle("dead", !u.alive);
    el.querySelector(".hpl i").style.width = (100 * u.hp / u.s.maxHp) + "%";
  });
}

function bind() {
  screenEl.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  screenEl.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => startStage(STAGES[b.dataset.stage - 1]));
  screenEl.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
    const id = b.dataset.toggle, i = P.team.indexOf(id);
    if (i >= 0) P.team.splice(i, 1); else if (P.team.length < Lv.teamSize) P.team.push(id); else return toast("A equipe já tem 4 criaturas.");
    save(); go("team");
  });
  screenEl.querySelectorAll("[data-star]").forEach(b => b.onclick = () => {
    const c = P.creatures.find(x => x.id === b.dataset.star);
    if (!Lv.canStar(c, P.gold)) return;
    c.shards -= Lv.shardsToStar(c.stars); P.gold -= Lv.goldToStar(c.stars); c.stars++;
    save(); toast(`${byId[c.id].name} agora tem ${c.stars} estrelas.`); go("team");
  });
  screenEl.querySelectorAll("[data-pull]").forEach(b => b.onclick = () => {
    const n = +b.dataset.pull, cost = n === 10 ? COST10 : COST1;
    if (P.crystals < cost) return toast("Cristais insuficientes.");
    P.crystals -= cost;
    lastPull = pull(P, n).map(c => ({ c, isNew: grant(P, c.id) }));
    save(); renderScreen();
  });
  screenEl.querySelectorAll("[data-cast]").forEach(b => b.onclick = () => battle && battle.cast(+b.dataset.cast));
  const sp = $("speed"); if (sp) sp.onclick = () => { speed = speed > 1 ? 1 : 2; sp.textContent = speed > 1 ? "2x" : "1x"; };
}

function startStage(stage) {
  if (!P.team.length) { toast("Monte uma equipe primeiro."); return go("team"); }
  clearArena();
  currentStage = stage;
  const team = P.team.map(id => { const c = P.creatures.find(x => x.id === id); return statsOf(byId[id], c.level, c.stars); });
  battle = new Battle(team, stage.waves.map(w => w.map(e => statsOf(byId[e.id], e.level, e.stars))));
  battle.players.forEach(u => spawn(u));
  battle.events = battle.events.filter(e => e.kind !== "wave");
  battle.enemies.forEach(u => spawn(u));
  screen = "battle"; renderScreen();
}

function finishBattle() {
  const win = battle.state === "win", s = currentStage, r = { win, gold: 0, xp: 0, crystals: 0, lv: [] };
  if (win) {
    r.gold = s.gold; r.xp = s.xp;
    if (s.n > P.best) { P.best = s.n; r.crystals = s.crystals; }
    P.gold += r.gold; P.crystals += r.crystals;
    P.team.forEach(id => { const c = P.creatures.find(x => x.id === id); if (Lv.addXp(c, r.xp) > 0) r.lv.push(byId[id].name); });
    save();
  }
  battle = null; lastResult = r;
  screen = "result"; renderScreen();
}

resize();
showIdleTeam();
renderScreen();
requestAnimationFrame(frame);
</script>

</body>
</html>
