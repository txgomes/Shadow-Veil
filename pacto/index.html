<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a10">
<title>Pacto dos Invocadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Figtree:wght@400;600;800&display=swap">
<style>
*{box-sizing:border-box} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0;font-size:14px} [hidden]{display:none!important}
</style>
<style>
/* Layout: portrait, one-thumb. The 3D crypt fills the screen; HUD hugs the top and the 6-card deck the bottom. Single dark look by choice. */
:root {
  --void: #0c0a10;
  --stone: #1a1620;
  --panel: rgba(22, 18, 28, 0.94);
  --edge: #5a4a36;
  --bronze: #b08a52;
  --ink: #ece4d8;
  --muted: #a39686;
  --blood: #c8413f;
  --mana: #8c5cf0;
  --heal: #5fc48a;
  --display: "Cormorant SC", "Palatino Linotype", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; }
@media (min-width: 560px) { #app { border-left: 1px solid #2a2230; border-right: 1px solid #2a2230; } }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
#overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.hpb { position: absolute; width: 38px; height: 5px; background: #000c; transform: translate(-50%, -50%); clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%); }
.hpb i { display: block; height: 100%; background: var(--blood); }
.hpb.ally i { background: var(--heal); }
.hpb.boss { width: 90px; height: 7px; }
.pop { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 15px; text-shadow: 0 2px 0 #000, 0 0 5px #000; animation: rise 0.8s ease-out forwards; white-space: nowrap; }
.pop.big { font-size: 20px; font-family: var(--display); }
@keyframes rise { to { transform: translate(-50%, -160%); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pop { animation-duration: 0.01s; } }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
.btn { background: linear-gradient(#2a2230, #1b1620); border: 1px solid var(--edge); border-radius: 4px; padding: 11px 16px; font-weight: 600; letter-spacing: 0.02em; }
.btn:hover:not(:disabled) { border-color: var(--bronze); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.gold { background: linear-gradient(#c9a063, #8d6a37); color: #1b1006; border-color: #e3c38a; font-weight: 800; }

.layer { position: absolute; inset: 0; display: flex; flex-direction: column; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 10px 12px; }
.layer.pass { pointer-events: none; }
.layer.pass > * { pointer-events: auto; }
.scrim { background: radial-gradient(ellipse at 50% 30%, #0c0a10aa, #0c0a10f2 70%); }

.topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.title-sm { font-family: var(--display); font-size: 20px; color: var(--bronze); margin-right: auto; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 3px; background: #000a; border: 1px solid #3a3040; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
.gem { width: 8px; height: 8px; transform: rotate(45deg); }

.home { margin: auto 0 2vh; display: grid; gap: 10px; text-align: center; }
.home h1 { font-family: var(--display); font-weight: 700; font-size: clamp(38px, 11vw, 58px); line-height: 0.95; margin: 0; color: #e7d3b0; text-shadow: 0 0 24px #8c5cf066, 0 3px 0 #000; text-wrap: balance; }
.home .tag { color: var(--muted); margin: 4px 0 14px; font-size: 14px; }
.home .btn { padding: 14px; font-size: 17px; }
.home .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.sheet { margin-top: 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 14px; overflow: auto; flex: 1; min-height: 0; }
.sheet h2 { font-family: var(--display); font-weight: 700; font-size: 26px; margin: 0 0 2px; color: #e7d3b0; text-wrap: balance; }
.sheet p.sub { color: var(--muted); margin: 0 0 12px; line-height: 1.45; font-size: 14px; }
.sheet h3 { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bronze); margin: 14px 0 8px; }

.map { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.node { aspect-ratio: 1; border-radius: 50%; border: 2px solid #3a3040; background: radial-gradient(#2a2230, #120f16); display: grid; place-items: center; font-family: var(--display); font-size: 20px; font-weight: 700; }
.node.done { border-color: var(--bronze); color: #e7d3b0; }
.node.next { border-color: var(--mana); box-shadow: 0 0 14px #8c5cf088; }
.node.boss { border-radius: 8px; }
.node:disabled { opacity: 0.35; cursor: default; }

.foes { display: flex; flex-wrap: wrap; gap: 6px; }
.deckgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.cardv { position: relative; border-radius: 6px; border: 1px solid #3a3040; background: #15111a; padding: 0; text-align: left; overflow: hidden; display: grid; grid-template-rows: 62px auto; }
.cardv .art { position: relative; overflow: hidden; }
.cardv .art canvas { width: 100%; height: 100%; display: block; }
.cardv .cost { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; background: radial-gradient(#b48cff, #4b2a8f); border: 1px solid #d9c6ff; box-shadow: 0 1px 4px #000; }
.cardv .lv { position: absolute; top: 5px; right: 5px; font-size: 11px; font-weight: 800; background: #000b; padding: 1px 5px; border-radius: 3px; }
.cardv .nm { padding: 5px 6px 6px; font-size: 12px; font-weight: 700; line-height: 1.15; }
.cardv .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 10.5px; margin-top: 2px; }
.cardv.sel { border-color: var(--mana); box-shadow: 0 0 0 1px var(--mana), 0 0 12px #8c5cf066; }
.cardv.r2 { border-color: #3f6aa8; } .cardv.r3 { border-color: #8a4fc8; } .cardv.r4 { border-color: #d0a14a; }
.cardv.sel.r2, .cardv.sel.r3, .cardv.sel.r4 { border-color: var(--mana); }
.bottombar { display: flex; gap: 10px; margin-top: 10px; }
.bottombar .btn { flex: 1; }

.hud-top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.herohp { position: relative; height: 16px; background: #000c; border: 1px solid #4a3a2c; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.herohp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #7d1f22, var(--blood)); }
.herohp span { position: relative; display: block; text-align: center; font-size: 11px; line-height: 16px; font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
.progress { margin-top: 6px; height: 3px; background: #000a; }
.progress i { display: block; height: 100%; background: var(--bronze); }
.focus-hint { margin-top: 6px; text-align: center; font-size: 12px; color: var(--muted); text-shadow: 0 1px 3px #000; }
.hud-bottom { margin-top: auto; display: grid; gap: 6px; }
.manabar { position: relative; height: 16px; background: #000c; border: 1px solid #3c2f55; }
.manabar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #4a2a9a, var(--mana), #c6a8ff); }
.manabar span { position: relative; display: block; font-size: 11px; line-height: 16px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
.deck { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.dc { position: relative; height: 84px; border-radius: 5px; border: 1px solid #4a3d55; background: #15111a; padding: 0; overflow: hidden; touch-action: manipulation; }
.dc canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.dc .cost { position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 11px; background: radial-gradient(#b48cff, #4b2a8f); border: 1px solid #d9c6ff; z-index: 2; }
.dc .nm { position: absolute; left: 2px; right: 2px; bottom: 3px; font-size: 9.5px; font-weight: 800; line-height: 1.05; text-align: center; text-shadow: 0 1px 2px #000, 0 0 4px #000; z-index: 2; }
.dc .cd { position: absolute; inset: 0; background: #000b; transform-origin: bottom; z-index: 1; }
.dc.poor { filter: grayscale(0.85) brightness(0.6); }
.dc.ready { border-color: #b48cff; }
.dc:active { transform: scale(0.96); }

.result { margin: auto 0; text-align: center; background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 22px 16px; }
.result h2 { font-family: var(--display); font-size: 40px; margin: 0; color: #e7d3b0; }
.result.lose h2 { color: var(--blood); }
.result p { color: var(--muted); line-height: 1.5; }
.toast { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); background: #0c0a10ee; border: 1px solid var(--edge); padding: 9px 14px; border-radius: 4px; z-index: 9; font-size: 14px; text-align: center; max-width: 80%; pointer-events: none; }
.banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--display); font-size: 34px; color: #e7d3b0; text-shadow: 0 0 18px #c8413f, 0 2px 0 #000; pointer-events: none; animation: banner 1.8s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.3); } 15% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.pull-res { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 12px; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.45; }
</style>
</head>
<body>

<div id="app">
  <div id="stage"></div>
  <div id="overlay"></div>
  <div id="ui"></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== SIM START =====
// Engine-free rules: data, progression and the run simulation. Mirrors the Unity Logic assembly.
const RARITY = ["Comum", "Rara", "Épica", "Lendária"];
const UNIT_TYPES = {
  // allies
  ghoul:    { name: "Carniçal", hp: 120, atk: 14, range: 1.1, interval: 0.8, speed: 3.6, radius: 0.4, role: "melee", color: "#7d8a6a", eye: "#b48cff" },
  bonearch: { name: "Arqueiro Ossudo", hp: 80, atk: 13, range: 5.5, interval: 1.0, speed: 3.2, radius: 0.4, role: "ranged", color: "#cfc6b2", eye: "#b48cff" },
  bat:      { name: "Morcego", hp: 45, atk: 8, range: 1.0, interval: 0.5, speed: 5.5, radius: 0.3, role: "melee", flying: true, color: "#3b2f45", eye: "#ff9ad5" },
  golem:    { name: "Golem de Lápide", hp: 650, atk: 20, range: 1.3, interval: 1.4, speed: 2.4, radius: 0.7, role: "tank", color: "#6b6670", eye: "#9fd3ff" },
  witch:    { name: "Bruxa do Pântano", hp: 110, atk: 22, range: 4.5, interval: 1.2, speed: 3.0, radius: 0.4, role: "healer", color: "#4f6b4a", eye: "#9cff9c" },
  knight:   { name: "Cavaleiro Sem Cabeça", hp: 420, atk: 42, range: 1.4, interval: 0.9, speed: 3.4, radius: 0.55, role: "melee", color: "#3a3440", eye: "#ff7a3d" },
  abom:     { name: "Abominação", hp: 900, atk: 55, range: 1.6, interval: 1.6, speed: 2.6, radius: 0.85, role: "area", color: "#8a5a5a", eye: "#ffd04a" },
  merc:     { name: "Prisioneiro", hp: 160, atk: 16, range: 1.1, interval: 0.9, speed: 3.5, radius: 0.45, role: "melee", color: "#8a6a4a", eye: "#e7d3b0" },
  // enemies
  crawler:  { name: "Rastejante", hp: 70, atk: 9, range: 1.0, interval: 0.9, speed: 3.4, radius: 0.4, role: "melee", color: "#5a4a3a", eye: "#ff3b3b" },
  spearman: { name: "Esqueleto Lanceiro", hp: 110, atk: 13, range: 1.5, interval: 1.1, speed: 2.8, radius: 0.45, role: "melee", color: "#bfb59f", eye: "#ff3b3b" },
  ogre:     { name: "Ogro do Pântano", hp: 480, atk: 26, range: 1.4, interval: 1.6, speed: 1.9, radius: 0.8, role: "tank", color: "#5d6b45", eye: "#ff3b3b" },
  hexer:    { name: "Atirador Corrompido", hp: 70, atk: 12, range: 5.5, interval: 1.3, speed: 2.6, radius: 0.4, role: "ranged", color: "#4a3a5a", eye: "#ff3b3b" },
  shaman:   { name: "Xamã Ossudo", hp: 90, atk: 18, range: 4.5, interval: 1.6, speed: 2.4, radius: 0.4, role: "healer", color: "#6a5040", eye: "#ff3b3b" },
  boss:     { name: "Senhor do Sino Partido", hp: 2600, atk: 34, range: 2.0, interval: 1.5, speed: 1.7, radius: 1.2, role: "area", color: "#2e2636", eye: "#ff2020", boss: true },
};
const CARDS = [
  { id: "ghoul", name: "Carniçal", kind: "summon", unit: "ghoul", count: 2, cost: 3, cd: 4, rarity: 0, text: "2 lutadores rápidos" },
  { id: "bonearch", name: "Arqueiro Ossudo", kind: "summon", unit: "bonearch", count: 2, cost: 4, cd: 5, rarity: 0, text: "2 atiradores à distância" },
  { id: "bat", name: "Enxame de Morcegos", kind: "summon", unit: "bat", count: 3, cost: 2, cd: 3, rarity: 0, text: "3 voadores frágeis" },
  { id: "frost", name: "Névoa Gélida", kind: "spell", spell: "slow", cost: 3, cd: 8, rarity: 0, text: "Abranda inimigos à volta" },
  { id: "golem", name: "Golem de Lápide", kind: "summon", unit: "golem", count: 1, cost: 7, cd: 10, rarity: 1, text: "Tanque, aguenta tudo" },
  { id: "witch", name: "Bruxa do Pântano", kind: "summon", unit: "witch", count: 1, cost: 5, cd: 8, rarity: 1, text: "Cura os aliados" },
  { id: "balm", name: "Bálsamo Sombrio", kind: "spell", spell: "heal", cost: 4, cd: 10, rarity: 1, text: "Cura 35% a todos" },
  { id: "embers", name: "Chuva de Brasas", kind: "spell", spell: "fire", cost: 5, cd: 7, rarity: 1, text: "Dano em área no alvo" },
  { id: "candle", name: "Vela de Almas", kind: "spell", spell: "mana", cost: 1, cd: 12, rarity: 2, text: "Devolve 4 de mana" },
  { id: "knight", name: "Cavaleiro Sem Cabeça", kind: "summon", unit: "knight", count: 1, cost: 9, cd: 12, rarity: 2, text: "Dano corpo a corpo alto" },
  { id: "abom", name: "Abominação", kind: "summon", unit: "abom", count: 1, cost: 13, cd: 18, rarity: 3, text: "Gigante com dano em área" },
];
const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));
const STARTER_CARDS = ["ghoul", "bonearch", "bat", "frost", "golem", "balm"];
const DRAW_RATES = [0.62, 0.27, 0.09, 0.02], DRAW_COST = 120, DRAW10_COST = 1080, LEGEND_PITY = 60;

const Prog = {
  cardScale: lv => 1 + 0.12 * (lv - 1),
  heroScale: lv => 1 + 0.1 * (lv - 1),
  maxCardLevel: 10,
  copiesToLevel: lv => lv * 2,
  goldToLevel: lv => lv * lv * 60,
  heroXpToNext: lv => 80 + lv * 40,
};

function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// World 1: ten stages, a mini-boss ogre at 5 and the bell lord at 10.
function stageDef(n) {
  const pools = [["crawler"], ["crawler", "spearman"], ["crawler", "spearman", "hexer"], ["crawler", "spearman", "hexer", "shaman"]];
  const pool = pools[Math.min(pools.length - 1, Math.floor((n - 1) / 2))];
  return {
    n, boss: n === 10, mini: n === 5,
    name: n === 10 ? "O Sino Partido" : ["Portão da Cripta", "Ossário", "Corredor dos Jarros", "Celas Esquecidas", "Covil do Ogro", "Capela Afundada", "Escadaria Sombria", "Ponte dos Ossos", "Sala dos Ecos"][n - 1],
    length: 60 + n * 6,
    groups: 3 + Math.ceil(n * 0.7),
    level: n,
    pool,
    gold: 80 + n * 25, xp: 40 + n * 12, crystals: 80,
  };
}

class Run {
  constructor(stage, deck, profile, seed) {
    this.stage = stage;
    this.r = rng(seed || stage.n * 7919);
    this.t = 0;
    this.state = "run";
    this.events = [];
    this.units = [];
    this.objects = [];
    this.nextId = 1;
    this.mana = 6; this.maxMana = 30; this.regen = 0.55;
    this.loot = { gold: 0, copies: {} };
    this.cards = deck.map(id => ({ def: CARD[id], level: (profile.cards[id] || { level: 1 }).level, cd: 0 }));
    const hs = Prog.heroScale(profile.heroLevel);
    this.hero = this.add({ type: "hero", team: "P", x: 0, z: 0, hp: Math.round(320 * hs), atk: Math.round(18 * hs), range: 6.5, interval: 0.55, speed: 4.6, radius: 0.45, role: "ranged", hero: true });
    this.moveTo = null; this.focus = null;
    this.build();
  }
  add(o) {
    const u = Object.assign({ id: this.nextId++, cdT: 0, slow: 0, maxHp: o.hp, awake: true, lunge: 0, vx: 0, vz: 0 }, o);
    this.units.push(u);
    this.events.push({ k: "spawn", u });
    return u;
  }
  spawnUnit(typeId, team, x, z, level, extra) {
    const T = UNIT_TYPES[typeId], s = team === "P" ? Prog.cardScale(level) : (T.boss ? 1 : 1.25) * (1 + 0.16 * (level - 1));
    return this.add(Object.assign({ type: typeId, team, x, z, hp: Math.round(T.hp * s), atk: Math.round(T.atk * s), range: T.range, interval: T.interval, speed: T.speed, radius: T.radius, role: T.role, flying: !!T.flying, boss: !!T.boss }, extra));
  }
  build() {
    const S = this.stage, r = this.r, L = S.length;
    this.endZ = -L;
    for (let g = 0; g < S.groups; g++) {
      const z = -14 - g * ((L - 22) / Math.max(1, S.groups - 1)) * (S.boss ? 0.85 : 1);
      const count = 3 + Math.floor(r() * (2 + S.n / 3));
      const gx = (r() - 0.5) * 6;
      const group = g;
      for (let i = 0; i < count; i++) {
        const type = S.pool[Math.floor(r() * S.pool.length)];
        this.spawnUnit(type, "E", gx + (r() - 0.5) * 3, z + (r() - 0.5) * 3, S.level, { awake: false, group });
      }
      if (S.mini && g === S.groups - 1) this.spawnUnit("ogre", "E", gx, z - 2, S.level + 2, { awake: false, group, hp: 900 + 120 * S.level });
    }
    if (S.boss) this.bossUnit = this.spawnUnit("boss", "E", 0, -L + 7, 1, { awake: false, group: 99, summonT: 6 });
    for (let z = -6; z > -L + 4; z -= 5 + r() * 5) this.objects.push({ id: this.nextId++, kind: r() < 0.82 ? "jar" : "chest", x: (r() - 0.5) * 10, z, done: false });
    if (S.n >= 3) this.objects.push({ id: this.nextId++, kind: "cage", x: (r() - 0.5) * 8, z: -L * 0.45, done: false });
    this.objects.forEach(o => this.events.push({ k: "obj", o }));
  }
  get allies() { return this.units.filter(u => u.team === "P" && u.hp > 0); }
  get foes() { return this.units.filter(u => u.team === "E" && u.hp > 0); }
  dist(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }
  nearest(from, list, maxD) { let best = null, bd = maxD; for (const u of list) { const d = this.dist(from, u); if (d < bd) { bd = d; best = u; } } return best; }

  playCard(i) {
    const c = this.cards[i];
    if (!c || this.state !== "run" || c.cd > 0 || this.mana < c.def.cost) return false;
    const h = this.hero, d = c.def;
    if (d.kind === "spell" && d.spell === "fire" && !this.spellTarget()) return false;
    this.mana -= d.cost; c.cd = d.cd;
    if (d.kind === "summon") {
      for (let k = 0; k < d.count; k++) {
        const a = (k - (d.count - 1) / 2) * 0.9;
        this.spawnUnit(d.unit, "P", h.x + a, h.z - 1.4, c.level, { summoned: true });
      }
      this.events.push({ k: "summon", x: h.x, z: h.z - 1.4 });
    } else this.castSpell(d.spell, c.level);
    return true;
  }
  spellTarget() {
    const f = this.focus && this.units.find(u => u.id === this.focus && u.hp > 0);
    return f || this.nearest(this.hero, this.foes.filter(u => u.awake), 12);
  }
  castSpell(spell, lv) {
    const h = this.hero, s = Prog.cardScale(lv);
    if (spell === "fire") {
      const t = this.spellTarget();

function drawCards(profile, count, free) {

    let r;

}

const tmp = new THREE.Vector3();

function present(e) {
  if (e.k === "spawn") { viewFor(e.u); if (e.u.summoned) burst(e.u.x, e.u.z, "#8c5cf0", 0.5, 0.4); }
  else if (e.k === "obj") { const m = objModel(e.o); level.add(m); objViews.set(e.o.id, m); }
  else if (e.k === "hit") { const v = views.get(e.u.id); if (v) pop(e.u.x, e.u.boss ? 4 : 2, e.u.z, e.n, e.u.team === "P" ? "#ff8a8a" : e.spell ? "#ffb347" : "#fff", e.spell); }
  else if (e.k === "heal") pop(e.u.x, 2, e.u.z, "+" + e.n, "#7dffa8");
  else if (e.k === "beam") beam(e.from, e.to, e.heal ? "#9cff9c" : e.arrow ? "#ffe0a8" : e.from.team === "P" ? "#c6a8ff" : "#ff5a5a", e.arrow ? 0.05 : 0.035);
  else if (e.k === "fx") {

    burst(e.x, e.z, col, e.fx === "frost" ? 2 : e.fx === "fire" ? 0.9 : e.fx === "slam" ? 0.6 : 0.8, 0.6);
    if (e.fx === "fire") for (let i = 0; i < 8; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 4), glow("#ff8a3d")); const ox = (Math.random() - 0.5) * 4, oz = (Math.random() - 0.5) * 4; s.position.set(e.x + ox, 8, e.z + oz); addFx(s, 0.35 + Math.random() * 0.2, (f, k) => s.position.y = 8 * (1 - k)); }
  }
  else if (e.k === "summon") burst(e.x, e.z, "#8c5cf0", 0.8, 0.5);
  else if (e.k === "loot") { const m = objViews.get(e.o.id); if (m) level.remove(m); pop(e.o.x, 1.4, e.o.z, e.text, e.color, true); }
  else if (e.k === "ambush") banner(e.boss ? "O Senhor do Sino desperta" : "Emboscada!");
  else if (e.k === "bell") { burst(e.x, e.z, "#ff2020", 1.6, 0.8); pop(e.x, 4.6, e.z, "DONG", "#ff6a6a", true); }
}

// Input: drag on the ground to walk, tap an enemy to focus it.
const ray = new THREE.Raycaster(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ndc = new THREE.Vector2();
let dragging = false;
function groundPoint(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera); const p = new THREE.Vector3(); return ray.ray.intersectPlane(ground, p) ? p : null;
}
function enemyAt(ev) {
  const r = renderer.domElement.getBoundingClientRect(); let best = null, bd = 34;
  for (const u of run.foes) { if (!u.awake) continue; const [sx, sy] = toScreen(u.x, 0.8 * (u.boss ? 2.2 : 1), u.z); const d = Math.hypot(sx - (ev.clientX - r.left), sy - (ev.clientY - r.top)); if (d < bd + (u.boss ? 30 : 0)) { bd = d; best = u; } }
  return best;
}
renderer.domElement.addEventListener("pointerdown", ev => {
  if (!run || run.state !== "run") return;
  const e = enemyAt(ev);
  if (e) { run.focus = e.id; return; }
  const p = groundPoint(ev); if (p) { run.moveTo = { x: p.x, z: p.z }; dragging = true; renderer.domElement.setPointerCapture(ev.pointerId); }
});
renderer.domElement.addEventListener("pointermove", ev => { if (dragging && run) { const p = groundPoint(ev); if (p) run.moveTo = { x: p.x, z: p.z }; } });
renderer.domElement.addEventListener("pointerup", () => dragging = false);
renderer.domElement.addEventListener("pointercancel", () => dragging = false);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (run && screen === "battle" && !paused) {
    run.step(dt * speedMul);
    const evs = run.events; run.events = []; evs.forEach(present);
    if (run.state !== "run") endRun(); else updateHud();
  }
  const t = now / 1000;
  if (run) {
    const h = run.hero;
    // Keep the heroine a little below the middle so the ambushes ahead stay in view above the deck.
    camZ += (h.z - camZ) * Math.min(1, dt * 4);
    camera.position.set(h.x * 0.25, 14, camZ + 7.5);
    camera.lookAt(h.x * 0.25, 0, camZ - 3);
    heroLight.position.set(h.x, 3, h.z);
    for (const [id, v] of views) {
      const u = v.u;
      v.m.position.x = u.x; v.m.position.z = u.z;
      if (u.lunge > 0) { v.m.position.x += (u.vx || 0) * u.lunge * 0.35; v.m.position.z += (u.vz || 0) * u.lunge * 0.35; }
      v.m.position.y = u.flying ? Math.sin(t * 6 + v.phase) * 0.15 : 0;
      if (u.vx || u.vz) v.m.rotation.y = Math.atan2(-(u.vx || 0), -(u.vz || 0));
      if (u.flying) v.m.children.forEach(c => { if (c.userData.wing) c.rotation.x = Math.sin(t * 18 + v.phase) * 0.6; });
      if (u.slow > 0) v.m.children[0]?.children?.[0]?.material?.emissive?.set("#1a3a5a");
      else if (!u.hero) v.m.children[0]?.children?.[0]?.material?.emissive?.set("#000000");
      if (u.hp <= 0) { v.fade -= dt * 2.5; v.m.scale.multiplyScalar(0.94); if (v.bar) v.bar.style.display = "none"; if (v.fade <= 0) { scene.remove(v.m); v.bar?.remove(); views.delete(id); } continue; }
      if (v.bar) {
        const show = u.awake && (u.hp < u.maxHp || u.team === "P" || u.boss);
        if (!show) { v.bar.style.display = "none"; continue; }
        const [sx, sy, sz] = toScreen(u.x, u.boss ? 4.4 : u.flying ? 1.9 : 1.95 * (u.type === "abom" ? 1.4 : 1), u.z);
        v.bar.style.display = sz < 1 ? "" : "none"; v.bar.style.left = sx + "px"; v.bar.style.top = sy + "px";
        v.bar.firstChild.style.width = (100 * u.hp / u.maxHp) + "%";
      }
    }
    const f = run.focus && run.units.find(u => u.id === run.focus && u.hp > 0);
    focusRing.visible = !!f; if (f) { focusRing.position.set(f.x, 0.05, f.z); focusRing.scale.setScalar(f.boss ? 2 : 1); }
    moveMark.visible = !!run.moveTo; if (run.moveTo) moveMark.position.set(run.moveTo.x, 0.05, run.moveTo.z);
    level.children.forEach(c => { if (c.userData.flicker !== undefined) c.scale.setScalar(0.85 + Math.sin(t * 11 + c.userData.flicker) * 0.15); if (c.userData.veil) c.userData.veil.material.opacity = 0.25 + Math.sin(t * 2) * 0.1; });
  } else {
    camera.position.set(Math.sin(t * 0.15) * 1.5, 7, 6); camera.lookAt(0, 0.5, -6);
  }
  for (let i = fxList.length - 1; i >= 0; i--) { const f = fxList[i]; f.t += dt; const k = Math.min(1, f.t / f.life); f.update(f, k); if (k >= 1) { scene.remove(f.m); fxList.splice(i, 1); } }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- Card art (procedural, original) ----------
const artCache = new Map();
function cardArt(id, w = 120, h = 90) {
  const key = id + w; if (artCache.has(key)) return artCache.get(key);
  const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d");
  const card = CARD[id], T = card.unit ? UNIT_TYPES[card.unit] : null;
  const base = T ? T.color : { slow: "#3a6a8a", heal: "#3a7a5a", fire: "#8a3a1a", mana: "#5a3a9a" }[card.spell];
  const grd = g.createRadialGradient(w / 2, h * 0.45, 4, w / 2, h / 2, w * 0.7); grd.addColorStop(0, base); grd.addColorStop(1, "#0a080c");
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  g.fillStyle = "rgba(0,0,0,0.55)";
  if (T) {
    // silhouette
    g.beginPath();
    if (T.role === "tank" || card.unit === "abom") g.ellipse(w / 2, h * 0.62, w * 0.26, h * 0.36, 0, 0, Math.PI * 2);
    else if (T.flying) { g.moveTo(w * 0.15, h * 0.4); g.quadraticCurveTo(w / 2, h * 0.1, w * 0.85, h * 0.4); g.quadraticCurveTo(w / 2, h * 0.75, w * 0.15, h * 0.4); }
    else { g.moveTo(w / 2, h * 0.18); g.lineTo(w * 0.72, h); g.lineTo(w * 0.28, h); g.closePath(); }
    g.fill();
    g.fillStyle = T.eye; g.shadowColor = T.eye; g.shadowBlur = 8;
    const ey = T.role === "tank" || card.unit === "abom" ? h * 0.42 : T.flying ? h * 0.38 : h * 0.36;
    g.beginPath(); g.arc(w / 2 - 6, ey, 2.4, 0, 7); g.arc(w / 2 + 6, ey, 2.4, 0, 7); g.fill();
    if (card.count > 1) { g.shadowBlur = 0; g.fillStyle = "#e7d3b0"; g.font = "800 13px Figtree, sans-serif"; g.textAlign = "right"; g.fillText("x" + card.count, w - 5, h * 0.3); }
  } else {
    g.strokeStyle = { slow: "#bfe6ff", heal: "#9cff9c", fire: "#ffb060", mana: "#d6c0ff" }[card.spell]; g.lineWidth = 2; g.shadowColor = g.strokeStyle; g.shadowBlur = 10;
    for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(w / 2, h * 0.55, 8 + i * 9, 0, Math.PI * 2); g.stroke(); }
  }
  artCache.set(key, c); return c;
}

      <button class="btn" data-draw="1" ${P.crystals >= DRAW_COST ? "" : "disabled"}>x1 · ${DRAW_COST}</button>
      <button class="btn gold" data-draw="10" ${P.crystals >= DRAW10_COST ? "" : "disabled"}>x10 · ${DRAW10_COST}</button></div>
    ${lastPull ? `<div class="pull-res">${lastPull.map(r => cardHtml(r.c.id, { sub: r.isNew ? "Nova!" : "+1 cópia", sel: r.c.rarity >= 2 })).join("")}</div>` : ""}
    <p class="note">Os cristais vêm da primeira vitória em cada fase. Neste protótipo não há compras.</p></div></div>`;
}

function updateHud() {
  const h = run.hero;
  $("hpFill").style.width = (100 * h.hp / h.maxHp) + "%"; $("hpText").textContent = `Sera ${h.hp} / ${h.maxHp}`;
  $("manaFill").style.width = (100 * run.mana / run.maxMana) + "%"; $("manaText").textContent = `Mana ${Math.floor(run.mana)} / ${run.maxMana}`;
  $("prog").style.width = Math.min(100, 100 * -h.z / -run.endZ) + "%";
  run.cards.forEach((c, i) => {
    const el = $("dc" + i); if (!el) return;
    if (!el.dataset.art) { el.dataset.art = 1; const cv = document.createElement("canvas"); cv.width = 120; cv.height = 90; cv.getContext("2d").drawImage(cardArt(c.def.id), 0, 0); el.prepend(cv); }
    $("cd" + i).style.transform = `scaleY(${c.cd / c.def.cd})`;
    el.classList.toggle("poor", run.mana < c.def.cost);
    el.classList.toggle("ready", run.mana >= c.def.cost && c.cd === 0);
  });
}

function bind() {
  ui.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  ui.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => { selStage = +b.dataset.stage; pendingDeck = P.deck.filter(id => P.cards[id]).slice(0, 6); go("deck"); });
  ui.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const id = b.dataset.pick, i = pendingDeck.indexOf(id);
    if (i >= 0) pendingDeck.splice(i, 1); else if (pendingDeck.length < 6) pendingDeck.push(id); else return toast("O baralho já tem 6 cartas.");
    render();
  });
  const st = ui.querySelector("[data-start]"); if (st) st.onclick = () => { P.deck = pendingDeck.slice(); save(); startRun(selStage); };
  ui.querySelectorAll("[data-card]").forEach(b => b.onclick = () => {
    if (!run || paused) return;
    const c = run.cards[+b.dataset.card];
    if (!run.playCard(+b.dataset.card)) toast(c.cd > 0 ? "Em recarga." : run.mana < c.def.cost ? "Mana insuficiente." : "Sem alvo por perto.");
  });
  ui.querySelectorAll("[data-up]").forEach(b => b.onclick = () => {
    const id = b.dataset.up, o = P.cards[id], need = Prog.copiesToLevel(o.level), gold = Prog.goldToLevel(o.level);
    if (o.level >= Prog.maxCardLevel) return toast("Já está no nível máximo.");
    if (o.copies < need) return toast(`Faltam ${need - o.copies} cópias.`);
    if (P.gold < gold) return toast("Ouro insuficiente.");
    o.copies -= need; P.gold -= gold; o.level++; save(); toast(`${CARD[id].name} subiu para o nível ${o.level}.`); render();
  });
  ui.querySelectorAll("[data-draw]").forEach(b => b.onclick = () => {
    const k = b.dataset.draw, today = new Date().toISOString().slice(0, 10);
    let res;
    if (k === "free") { if (P.freeDay === today) return; P.freeDay = today; res = drawCards(P, 1, true); }
    else { const cost = k === "10" ? DRAW10_COST : DRAW_COST; if (P.crystals < cost) return toast("Cristais insuficientes."); P.crystals -= cost; res = drawCards(P, k === "10" ? 10 : 1, false); }
    lastPull = res.map(c => ({ c, isNew: grantCard(P, c.id) })); save(); render();
  });
  const sp = $("spd"); if (sp) sp.onclick = () => { speedMul = speedMul === 1 ? 2 : 1; sp.textContent = speedMul + "x"; };
  const pa = $("pause"); if (pa) pa.onclick = () => { paused = !paused; render(); };
  const re = $("resume"); if (re) re.onclick = () => { paused = false; render(); };
  const qu = $("quit"); if (qu) qu.onclick = () => { paused = false; run.state = "lose"; endRun(); };
}

function startRun(n) {
  clearViews(); titleGroup = null;
  run = new Run(stageDef(n), P.deck, P);
  buildLevel(run);
  const evs = run.events; run.events = []; evs.forEach(present);
  camZ = run.hero.z; paused = false;
  screen = "battle"; render();
}
function endRun() {
  lastResult = claimRun(P, run); save();
  screen = "result"; render();
}

resize();
showTitleScene();
render();
requestAnimationFrame(frame);
</script>

</body>
</html>
